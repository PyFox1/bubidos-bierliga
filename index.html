<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap');

:root{
  --zinn:#343A42; --zinn-tief:#272C33; --linie:#525B66;
  --deckel:#E9E1CD; --deckel-tief:#D8CDB2; --rand:#B9AC8C;
  --tinte:#22262B; --tinte-weich:#6C6659;
  --blau:#1C5FA8; --malz:#B87513; --rot:#9E3226; --gruen:#3D6B45;
  --display:'Anton',Impact,sans-serif;
  --body:'Karla',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--zinn-tief);color:var(--deckel);font-family:var(--body);
  font-size:16px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--malz);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 90px}

.kopf{background:var(--zinn);padding:16px 14px 0;border-bottom:1px solid var(--linie)}
.kopf-inner{max-width:640px;margin:0 auto}
.marke{margin:0;line-height:0}
.marke svg{display:block}
.unterzeile{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:#9AA2AC;margin:6px 0 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.unterzeile button{font:inherit;color:#9AA2AC;text-decoration:underline;text-underline-offset:3px}
.raute{height:10px;background-color:#EDF2F7;background-size:14px 14px;background-position:0 0,7px 7px;
  background-image:
    linear-gradient(45deg,var(--blau) 25%,transparent 25%,transparent 75%,var(--blau) 75%),
    linear-gradient(45deg,var(--blau) 25%,transparent 25%,transparent 75%,var(--blau) 75%)}
.kopf-inner{max-width:640px;margin:0 auto}
.kopf-archiv{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.kopf-tasten{display:flex;gap:6px;flex:0 0 auto;padding-top:2px}
.kopf-tasten button{width:40px;height:40px;border-radius:5px;color:#9AA2AC;
  display:grid;place-items:center}
.kopf-tasten button:active{background:rgba(255,255,255,.06)}
.kopf-mitte{flex:1;min-width:0}
.kopf-wort{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:13.5px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--deckel);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf-zahlen{font-family:var(--mono);font-size:10px;color:#8A929C;margin-top:3px;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf-zaehlen{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.kopf-ort{flex:1;min-width:0;text-align:left}
.kz-titel{display:block;font-family:var(--display);font-size:19px;text-transform:uppercase;
  letter-spacing:.02em;color:var(--deckel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kz-wo{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:#98A0AA;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kopf-unter{display:flex;align-items:center;gap:12px;padding-bottom:13px;min-height:44px}
.kopf-zurueck{font-size:15px;color:#9AA2AC;flex:0 0 auto}
.kopf-utitel{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.deckel{position:relative;background:var(--deckel);color:var(--tinte);border-radius:5px;
  padding:14px 16px;margin:10px 0;box-shadow:0 2px 0 var(--deckel-tief),0 6px 14px rgba(0,0,0,.28)}
.deckel::after{content:'';position:absolute;inset:5px;border:1px solid var(--rand);
  border-radius:3px;pointer-events:none}
.deckel > *{position:relative;z-index:1}

.zeile{display:flex;align-items:center;gap:10px}
.platz{font-family:var(--display);font-size:26px;line-height:1;color:var(--tinte-weich);
  min-width:32px;text-align:center}
.platz.eins{color:var(--malz)}
.name{font-weight:800;font-size:18px;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.name.tipp{text-decoration:underline;text-decoration-color:var(--rand);text-underline-offset:4px}
.elo{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.02em}
.meta{font-family:var(--mono);font-size:11px;color:var(--tinte-weich);letter-spacing:.05em;
  margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.delta{font-family:var(--mono);font-size:12px;padding:2px 6px;border-radius:3px;white-space:nowrap}
.delta.dplus{background:rgba(61,107,69,.16);color:var(--gruen)}
.delta.dminus{background:rgba(158,50,38,.14);color:var(--rot)}
.delta.dnull{background:rgba(0,0,0,.06);color:var(--tinte-weich)}
.ruht{opacity:.55}

.striche{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end;min-height:26px;margin:10px 0 2px}
.striche svg{display:block}
.striche .leer{font-family:var(--mono);font-size:12px;color:var(--tinte-weich);letter-spacing:.08em}

.wahl{position:sticky;top:0;z-index:20;background:var(--zinn-tief);margin:0 -14px;
  padding:10px 14px 10px;border-bottom:1px solid var(--linie)}
.wahl-titel{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:#98A0AA;margin-bottom:8px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--linie);
  font-size:14px;font-weight:600;color:#C9D0D8;white-space:nowrap}
.chip[data-an="1"]{background:var(--malz);border-color:var(--malz);color:#1B1B1B}
.chip small{font-family:var(--mono);font-size:10px;opacity:.7;margin-left:5px}
.wahl-zeile{display:flex;align-items:center;gap:10px;margin-top:7px}
.wahl-erg{flex:0 0 auto;font-family:var(--mono);font-size:11px;color:var(--malz);white-space:nowrap}
.kamknopf{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:9px;
  padding:11px;border-radius:5px;border:1px dashed var(--malz);color:var(--malz);
  font-weight:700;font-size:14px}
.leiste{display:flex;gap:7px;overflow-x:auto;margin:12px 0 0;scrollbar-width:none}
.leiste::-webkit-scrollbar{display:none}
.leiste button{flex:0 0 auto;padding:8px 14px;border-radius:5px;border:1px solid var(--linie);
  font-size:14px;font-weight:700;color:#98A0AA;white-space:nowrap}
.leiste button[data-an="1"]{background:var(--deckel);border-color:var(--deckel);color:var(--tinte)}
.leiste button.neu{border-style:dashed;color:var(--malz)}
.leiste.orte button{font-size:13.5px;font-weight:600;padding:7px 12px;border-radius:999px}
.ortname{display:flex;align-items:center;gap:9px;margin:12px 0 0}
.ortname input{flex:1;min-width:0;padding:9px 12px;border-radius:5px;border:1px solid var(--linie);
  background:var(--zinn);color:var(--deckel);font-weight:700}

<script>
const FASSUNG = '2026-09-08 17:52 · G5 (GitHub)';

/* ====== EINSTELLUNGEN – hier anpassen, falls sich Namen ändern ====== */
const GH_BESITZER = 'PyFox1';
const GH_REPO     = 'bubidos-bierliga-daten';
const GH_DATEI    = 'stand.json';
const GH_ZWEIG    = 'main';
/* =================================================================== */

const TOKEN_KEY = 'bubidos-token';
const SPIEGEL_KEY = 'bubidos-spiegel';
const ICH_KEY = 'bubidos-ich';

const GETRAENKE_PLATZ = null;

/* ---------- lokaler Kleinkram (Token, Gerätekennung, Spiegel) ---------- */
const lokal = {
  lesen(k){ try{ return window.localStorage.getItem(k); }catch(e){ return this._n && this._n[k] || null; } },
  schreiben(k,v){ try{ window.localStorage.setItem(k,v); }
    catch(e){ this._n = this._n || {}; this._n[k] = v; } },
  loeschen(k){ try{ window.localStorage.removeItem(k); }
    catch(e){ if(this._n) delete this._n[k]; } }
};

let token = null;
let gid = null;
let ghSha = null;
let ghFehler = null;

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '', teil = 0x8000;
  for(let i = 0; i < bytes.length; i += teil)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + teil));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

const GH_URL = () => 'https://api.github.com/repos/' + GH_BESITZER + '/' + GH_REPO
  + '/contents/' + GH_DATEI + '?ref=' + GH_ZWEIG;
const GH_SCHREIB = () => 'https://api.github.com/repos/' + GH_BESITZER + '/' + GH_REPO
  + '/contents/' + GH_DATEI;
const GH_VERLAUF = () => 'https://github.com/' + GH_BESITZER + '/' + GH_REPO
  + '/commits/' + GH_ZWEIG + '/' + GH_DATEI;

function ghKopf(){
  return {'Authorization':'Bearer ' + token, 'Accept':'application/vnd.github+json',
          'X-GitHub-Api-Version':'2022-11-28'};
}

const STAERKE = [
  {k:'leicht', n:'Leicht',      kurz:'L',  v:3.0},
  {k:'normal', n:'Normal',      kurz:'',   v:5.0},
  {k:'stark',  n:'Stark',       kurz:'S',  v:7.0},
  {k:'af',     n:'Alkoholfrei', kurz:'AF', v:0}
];
const GROESSE = [
  {k:'033', n:'0,33', l:0.33},
  {k:'05',  n:'0,5',  l:0.5},
  {k:'10',  n:'1,0',  l:1.0}
];
const S = k => STAERKE.find(x => x.k === k);
const Gr = k => GROESSE.find(x => x.k === k);
const teile = key => { const t = String(key||'').split(':'); return {s:S(t[0]), g:Gr(t[1])}; };
const beVon = key => { const {s,g} = teile(key); return s && g ? g.l*s.v/2.5 : 0; };
const literVon = key => { const {g} = teile(key); return g ? g.l : 0; };
const KOMBIS = (function(){ const a = [];
  STAERKE.forEach(s => GROESSE.forEach(g => a.push(s.k + ':' + g.k))); return a; })();
const leereZaehlung = () => { const z = {}; KOMBIS.forEach(k => z[k] = 0); return z; };
function nameVon(key){
  const {s,g} = teile(key);
  if(!s || !g) return '—';
  if(s.k === 'af') return 'Alkoholfrei ' + g.n;
  if(s.k === 'normal' && g.k === '05') return 'Halbe';
  if(s.k === 'normal' && g.k === '10') return 'Maß';
  return s.n + ' ' + g.n;
}
function kurzVon(key){
  const {s,g} = teile(key);
  if(!s || !g) return '—';
  if(s.k === 'af') return 'AF';
  if(s.k === 'normal' && g.k === '05') return 'Halbe';
  if(s.k === 'normal' && g.k === '10') return 'Maß';
  return (s.kurz || 'N') + ' ' + g.n;
}
const ALT_NEU = {halbe:'normal:05', pils:'normal:033', weizen:'normal:05',
                 ipa:'stark:033', mass:'normal:10', af:'af:05'};
const zaehlung = gs => { const z = {}; KOMBIS.forEach(k => z[k] = 0);
  (gs || []).forEach(k => { if(z[k] !== undefined) z[k]++; }); return z; };
const ausZaehlung = z => { const a = []; KOMBIS.forEach(k => {
  for(let i = 0; i < (z[k] || 0); i++) a.push(k); }); return a; };
const mischung = gs => { const z = zaehlung(gs);
  return KOMBIS.filter(k => z[k] > 0).map(k => z[k] + '\u00d7 ' + kurzVon(k)).join(' \u00b7 '); };

/* ---------- Zustand ---------- */
let ansicht = null;
let fazitOffen = null, frage = null, foto = null, blatt = null;
let wechsler = false, detailId = null, personId = null;
let rechnung = null, punkteOffen = false, letzteRunde = null;
let rundeFrage = false, benennen = false, entsperrt = null;
let exportiert = false, sicherBlatt = null, infoZiel = null, erklaer = null;
let stapel = [];
let vorwahl = null;

let state = {
  spieler: [], we: [], einst: {k:40, deckel:0}, geraete: {}, sortier:'elo',
  aktivWe:null, aktivTag:null, aktivOrt:null, wahlS:'normal', wahlG:'05',
  wahlOffen:false, stand:0
};
const wahlKey = () => state.wahlS + ':' + state.wahlG;
let neuKombi = {s:'normal', g:'05'};

function standDaten(){
  return {spieler:state.spieler, we:state.we, einst:state.einst, geraete:state.geraete || {},
          sortier:state.sortier || 'elo',
          aktivWe:state.aktivWe, aktivTag:state.aktivTag, aktivOrt:state.aktivOrt,
          stand:state.stand};
}

function migrieren(we){
  (we || []).forEach(w => (w.tage || []).forEach(t => (t.orte || []).forEach(o => {
    Object.keys(o.getraenke || {}).forEach(id => {
      o.getraenke[id] = (o.getraenke[id] || []).map(k => ALT_NEU[k] || k);
    });
  })));
  return we;
}
function uebernehmen(d){
  state.spieler = d.spieler || [];
  state.we = migrieren(d.we || []);
  state.einst = Object.assign({k:40, deckel:0, kiSchluessel:'', kiModell:'claude-opus-5'}, d.einst || {});
  state.geraete = d.geraete || {};
  state.sortier = d.sortier || 'elo';
  state.aktivWe = d.aktivWe === undefined ? null : d.aktivWe;
  state.aktivTag = d.aktivTag === undefined ? null : d.aktivTag;
  state.aktivOrt = d.aktivOrt === undefined ? null : d.aktivOrt;
  state.stand = d.stand || 0;
}

/* ---------- Gerätekennung ---------- */
function ichLaden(){
  gid = lokal.lesen(ICH_KEY);
  if(!gid){
    gid = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    lokal.schreiben(ICH_KEY, gid);
  }
}
function geraetSichern(){
  if(!gid) return false;
  if(!state.geraete) state.geraete = {};
  if(state.geraete[gid]) return false;
  const genutzt = Object.keys(state.geraete).map(x => state.geraete[x].nr || 0);
  let nr = 1; while(genutzt.indexOf(nr) >= 0) nr++;
  state.geraete[gid] = {nr, name:null};
  return true;
}
function geraetName(id){
  const g = state.geraete && state.geraete[id];
  if(!g) return null;
  return g.name || ('Gerät ' + g.nr);
}
const ichName = () => geraetName(gid);
async function ichSetzen(name){
  if(!gid) return;
  if(!state.geraete) state.geraete = {};
  if(!state.geraete[gid]) geraetSichern();
  state.geraete[gid].name = name || null;
  await sichern({sofort:true});
}

const zeitKurz = t => { const d = new Date(t);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
function vorWie(t){
  const m = Math.floor((Date.now()-t)/60000);
  if(m < 1) return 'gerade eben';
  if(m < 60) return 'vor ' + m + ' Min';
  const h = Math.floor(m/60);
  return 'vor ' + h + ' Std ' + (m%60 ? (m%60) + ' Min' : '');
}
function tagebuch(ort, eintrag){
  if(!ort.log) ort.log = [];
  ort.log.push(Object.assign({t:Date.now(), gid:gid || null}, eintrag));
  if(ort.log.length > 40) ort.log = ort.log.slice(-40);
}
const letzteRundeIm = ort => {
  const l = (ort.log || []).filter(x => x.art === 'runde');
  return l.length ? l[l.length-1] : null;
};

/* ---------- Speicher: GitHub ---------- */
function spiegelAblegen(){
  try{ lokal.schreiben(SPIEGEL_KEY, JSON.stringify({t:Date.now(), daten:standDaten()})); }catch(e){}
}
function spiegelLesen(){
  try{ return JSON.parse(lokal.lesen(SPIEGEL_KEY)).daten; }catch(e){ return null; }
}

async function laden(){
  if(!token) return false;
  try{
    const r = await fetch(GH_URL(), {headers:ghKopf(), cache:'no-store'});
    if(r.status === 404){ ghSha = null; ghFehler = null; return 'leer'; }
    if(r.status === 401 || r.status === 403){ ghFehler = 'token'; return false; }
    if(!r.ok){ ghFehler = 'netz'; return false; }
    const j = await r.json();
    ghSha = j.sha;
    ghFehler = null;
    uebernehmen(JSON.parse(b64dec(j.content)));
    spiegelAblegen();
    return true;
  }catch(e){ ghFehler = 'netz'; return false; }
}

let schreibTimer = null, schreibtGerade = false, nochmalSchreiben = false;

async function schreiben(){
  if(schreibtGerade){ nochmalSchreiben = true; return; }
  schreibtGerade = true;
  try{
    const koerper = {
      message: 'Stand ' + new Date().toISOString().slice(0,16).replace('T',' ')
        + (ichName() ? ' · ' + ichName() : ''),
      content: b64enc(JSON.stringify(standDaten(), null, 1)),
      branch: GH_ZWEIG
    };
    if(ghSha) koerper.sha = ghSha;
    let r = await fetch(GH_SCHREIB(), {method:'PUT', headers:ghKopf(), body:JSON.stringify(koerper)});
    if(r.status === 409 || r.status === 422){
      // Jemand anderes war schneller – dessen Fassung steht bereits als Commit in der Historie
      const vorher = standDaten();
      await laden();
      uebernehmen(vorher);
      state.stand = Date.now();
      koerper.content = b64enc(JSON.stringify(standDaten(), null, 1));
      koerper.sha = ghSha;
      r = await fetch(GH_SCHREIB(), {method:'PUT', headers:ghKopf(), body:JSON.stringify(koerper)});
      toast('Jemand hat gleichzeitig geändert – beides steht in der Historie');
    }
    if(r.status === 401 || r.status === 403){ ghFehler = 'token'; zeichnen(); return; }
    if(!r.ok){ ghFehler = 'netz'; toast('Nicht gespeichert – Verbindung prüfen'); zeichnen(); return; }
    const j = await r.json();
    ghSha = j.content && j.content.sha ? j.content.sha : ghSha;
    ghFehler = null;
    spiegelAblegen();
  }catch(e){
    ghFehler = 'netz'; toast('Nicht gespeichert – Verbindung prüfen');
  }finally{
    schreibtGerade = false;
    if(nochmalSchreiben){ nochmalSchreiben = false; schreiben(); }
  }
}

async function sichern(opt){
  state.stand = Date.now();
  spiegelAblegen();
  if(!token) return;
  if(opt && opt.sofort){
    clearTimeout(schreibTimer); schreibTimer = null;
    await schreiben();
    return;
  }
  clearTimeout(schreibTimer);
  schreibTimer = setTimeout(schreiben, 2500);
}

setInterval(async () => {
  if(document.hidden || !token || foto || blatt || schreibTimer || schreibtGerade) return;
  if(document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  try{
    const r = await fetch(GH_URL(), {headers:ghKopf(), cache:'no-store'});
    if(!r.ok) return;
    const j = await r.json();
    if(j.sha === ghSha) return;
    ghSha = j.sha;
    const d = JSON.parse(b64dec(j.content));
    if((d.stand || 0) > (state.stand || 0)){ uebernehmen(d); spiegelAblegen(); zeichnen(); }
  }catch(e){}
}, 25000);

/* ---------- Elo: gewertet wird der Tag ---------- */
function berechnen(){
  const R = {}; state.spieler.forEach(p => R[p.id] = 1500);
  const weTeil = {}, tagTeil = {}, ortTeil = {}, siege = {}, beSumme = {}, hoch = {};
  state.spieler.forEach(p => { weTeil[p.id] = 0; tagTeil[p.id] = 0; ortTeil[p.id] = 0;
    siege[p.id] = 0; beSumme[p.id] = 0; hoch[p.id] = 1500; });
  const log = [];
  const wes = [...state.we].sort((a,b) => (a.datum||'').localeCompare(b.datum||'') || a.id - b.id);

  wes.forEach(we => {
    const vorher = Object.assign({}, R);
    const tagLog = [];
    const dabeiWe = new Set();

    we.tage.forEach(tg => {
      const ids = [...new Set(tg.orte.flatMap(o => Object.keys(o.getraenke)))]
        .filter(id => R[id] !== undefined);
      const be = {}, roh = {}, liter = {}, literAf = {}, anzahl = {}, orte = {}, sorten = {};
      ids.forEach(id => {
        let b = 0, l = 0, a = 0, o = 0;
        const z = {}; KOMBIS.forEach(k => z[k] = 0);
        let lAf = 0;
        tg.orte.forEach(ort => {
          if(!(id in ort.getraenke)) return;
          o++;
          (ort.getraenke[id] || []).forEach(k => {
            b += beVon(k); a++; if(z[k] !== undefined) z[k]++;
            if(beVon(k) > 0) l += literVon(k); else lAf += literVon(k);
          });
        });
        literAf[id] = lAf;
        roh[id] = b;
        be[id] = state.einst.deckel > 0 ? Math.min(state.einst.deckel, b) : b;
        liter[id] = l; anzahl[id] = a; orte[id] = o; sorten[id] = z;
        tagTeil[id]++; ortTeil[id] += o; dabeiWe.add(id);
      });

      const n = ids.length, erg = {};
      ids.forEach(a => {
        let summe = 0;
        if(n >= 2) ids.forEach(b => {
          if(a === b) return;
          const ges = be[a] + be[b];
          const S = ges === 0 ? 0.5 : be[a]/ges;
          const E = 1/(1 + Math.pow(10,(R[b]-R[a])/400));
          summe += S - E;
        });
        erg[a] = {be:be[a], roh:roh[a], liter:liter[a], literAf:literAf[a] || 0,
                  anzahl:anzahl[a], orte:orte[a],
                  sorten:sorten[a], vorher:R[a], delta: n >= 2 ? state.einst.k/(n-1)*summe : 0};
      });
      ids.forEach(a => { R[a] = erg[a].vorher + erg[a].delta; erg[a].nachher = R[a];
        beSumme[a] += be[a]; if(R[a] > hoch[a]) hoch[a] = R[a]; });
      let best = -1;
      ids.forEach(a => { if(be[a] > best) best = be[a]; });
      if(best > 0) ids.forEach(a => { if(Math.abs(be[a] - best) < 1e-9) siege[a]++; });
      tagLog.push({tag:tg, erg});
    });

    dabeiWe.forEach(id => weTeil[id]++);
    log.push({we, vorher, nachher:Object.assign({}, R), tagLog});
  });
  return {R, weTeil, tagTeil, ortTeil, siege, beSumme, hoch, log};
}

function fazitVon(e){
  const {we, vorher, nachher, tagLog} = e;
  const ids = [...new Set(tagLog.flatMap(t => Object.keys(t.erg)))];
  const orteGesamt = we.tage.reduce((s,t) => s + t.orte.length, 0);

  const leute = ids.map(id => {
    const p = state.spieler.find(x => String(x.id) === String(id));
    const proTag = tagLog.filter(t => t.erg[id]).map(t => t.erg[id].be);
    const be = proTag.reduce((s,x) => s + x, 0);
    const liter = tagLog.reduce((s,t) => s + (t.erg[id] ? t.erg[id].liter : 0), 0);
    const literAf = tagLog.reduce((s,t) => s + (t.erg[id] ? t.erg[id].literAf : 0), 0);
    const anzahl = tagLog.reduce((s,t) => s + (t.erg[id] ? t.erg[id].anzahl : 0), 0);
    const orte = tagLog.reduce((s,t) => s + (t.erg[id] ? t.erg[id].orte : 0), 0);
    const z = {}; KOMBIS.forEach(k => z[k] = 0);
    tagLog.forEach(t => { if(t.erg[id]) KOMBIS.forEach(k => z[k] += t.erg[id].sorten[k]); });
    const schnitt = proTag.length ? be/proTag.length : 0;
    const streuung = proTag.length > 1
      ? Math.sqrt(proTag.reduce((s,x) => s + Math.pow(x-schnitt,2), 0)/proTag.length) : null;
    return {id, name:p ? p.name : '—', be, liter, literAf, anzahl, orte, sorten:z, tage:proTag.length,
            schnitt, streuung, delta:(nachher[id] || 0) - (vorher[id] || 0), nachher:nachher[id] || 1500};
  }).sort((a,b) => b.be - a.be);

  const gesBe = leute.reduce((s,l) => s + l.be, 0);
  const gesLiter = leute.reduce((s,l) => s + l.liter, 0);
  const gesAf = leute.reduce((s,l) => s + (l.literAf||0), 0);
  const gesAnzahl = leute.reduce((s,l) => s + l.anzahl, 0);
  const maxTage = tagLog.length;

  const orden = [];
  if(leute.length && gesBe > 0){
    orden.push({t:'Deckelkönig', w:leute[0].name, v:zahl(leute[0].be,2)+' BE gesamt'});
    if(maxTage > 1){
      const schlag = [...leute].filter(l => l.tage > 0).sort((a,b) => b.schnitt - a.schnitt)[0];
      if(schlag && schlag.schnitt > 0)
        orden.push({t:'Schlagzahl', w:schlag.name, v:'Ø '+zahl(schlag.schnitt,2)+' BE je Tag'});
    }
    const auf = [...leute].sort((a,b) => b.delta - a.delta)[0];
    if(auf && auf.delta > 0.05) orden.push({t:'Aufsteiger', w:auf.name, v:'+'+zahl(auf.delta)+' Punkte'});
    const konst = leute.filter(l => l.streuung !== null && l.tage === maxTage && l.be > 0)
                       .sort((a,b) => a.streuung - b.streuung)[0];
    if(konst) orden.push({t:'Gleichmaß', w:konst.name, v:'Ø '+zahl(konst.schnitt,2)+' BE je Tag'});
    const maxOrte = Math.max.apply(null, leute.map(l => l.orte));
    const durch = leute.filter(l => l.tage === maxTage && l.orte === maxOrte);
    if(durch.length && durch.length < leute.length && maxOrte > 1)
      orden.push({t:'Durchhalter', w:durch.map(l => l.name).join(', '),
                  v:maxOrte + ' von ' + orteGesamt + ' Locations, jeden Tag'});
  }
  return {leute, gesBe, gesLiter, gesAf, gesAnzahl, tage:maxTage, orteGesamt, orden, we};
}

/* ---------- Bausteine ---------- */
function strichGruppe(anzahl, durch){
  const s = [];
  for(let i = 0; i < anzahl; i++){ const x = 3 + i*6; s.push('<line x1="'+x+'" y1="3" x2="'+x+'" y2="22"/>'); }
  if(durch) s.push('<line x1="0.5" y1="22" x2="25.5" y2="3"/>');
  const w = durch ? 27 : Math.max(6, 3 + anzahl*6);
  return '<svg width="'+w+'" height="25" viewBox="0 0 '+w+' 25" aria-hidden="true" stroke="#22262B" '
    + 'stroke-width="2.1" stroke-linecap="round">' + s.join('') + '</svg>';
}
function strichliste(n){
  if(!n) return '<span class="leer">noch nichts</span>';
  let out = '';
  for(let i = 0; i < Math.floor(n/5); i++) out += strichGruppe(4, true);
  if(n % 5) out += strichGruppe(n % 5, false);
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zahl = (n,d) => (n || 0).toFixed(d === undefined ? 1 : d).replace('.',',');
const deltaChip = (d, attrs) => {
  if(d === null || d === undefined) return '<span class="delta dnull">–</span>';
  const kl = d > 0.05 ? 'dplus' : d < -0.05 ? 'dminus' : 'dnull';
  const txt = (d > 0 ? '+' : '') + zahl(d);
  return attrs
    ? '<button class="delta ' + kl + ' klickbar"' + attrs + ' aria-label="Rechenweg zu ' + txt + '">'
      + txt + '</button>'
    : '<span class="delta ' + kl + '">' + txt + '</span>';
};
const datumHuebsch = s => { if(!s) return ''; const t = s.split('-'); return t[2]+'.'+t[1]+'.'+t[0]; };
function toast(text){
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = text; d.setAttribute('role','status');
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 3000);
}
function gefahr(name, id, label, klasse){
  const key = name + ':' + (id === null || id === undefined ? '' : id);
  return '<button class="'+klasse+'" data-tu="'+name+'" data-id="'+(id === null || id === undefined ? '' : id)
    + '" data-frage="1">' + (frage === key ? 'Sicher? Nochmal' : label) + '</button>';
}

/* ---------- Zählen ---------- */
function aktuell(){
  const we = state.we.find(w => w.id === state.aktivWe);
  if(!we) return {};
  const tg = we.tage.find(t => t.id === state.aktivTag) || we.tage[0];
  if(!tg) return {we};
  const ort = tg.orte.find(o => o.id === state.aktivOrt) || tg.orte[0];
  return {we, tg, ort};
}

function kette(){
  const we = state.we.find(w => w.id === state.aktivWe);
  if(!we) return [];
  const k = [];
  we.tage.forEach(t => t.orte.forEach((o,i) =>
    k.push({tagId:t.id, ortId:o.id, tag:t, ort:o, nr:i+1, vonTag:t.orte.length})));
  return k;
}
function kettePos(k){
  const i = k.findIndex(x => x.tagId === state.aktivTag && x.ortId === state.aktivOrt);
  return i < 0 ? k.length - 1 : i;
}
function istRueckblick(){
  const k = kette();
  if(k.length < 2) return false;
  const {ort} = aktuell();
  if(!ort || ort.id === entsperrt) return false;
  return kettePos(k) < k.length - 1;
}

function ansichtZaehlen(){
  let {we, tg, ort} = aktuell();
  if(we && tg && !ort){
    const g = {}; (we.dabei || []).forEach(id => g[id] = []);
    ort = {id:neueId(), name:'Location 1', getraenke:g};
    tg.orte.push(ort);
    state.aktivOrt = ort.id;
  }
  if(!we || !ort) return ansichtNeuesWe();

  const {log} = berechnen();
  const e = log.find(x => x.we.id === we.id);
  const tl = e ? e.tagLog.find(t => t.tag.id === tg.id) : null;
  const erg = tl ? tl.erg : {};

  const auf = state.wahlOffen;
  const wahlS = STAERKE.map(x => '<button class="chip" data-tu="wahlS" data-k="'+x.k+'" data-an="'
      + (state.wahlS===x.k?1:0) + '">' + x.n
      + (x.k==='af' ? '' : '<small>' + zahl(x.v,0) + '%</small>') + '</button>').join('');
  const wahlG = GROESSE.map(x => '<button class="chip" data-tu="wahlG" data-k="'+x.k+'" data-an="'
      + (state.wahlG===x.k?1:0) + '">' + x.n + '</button>').join('');

  const k = kette();
  const pos = kettePos(k);
  const rueck = istRueckblick();
  const hier = Object.keys(ort.getraenke);
  const nameZu = id => { const q = state.spieler.find(x => String(x.id) === String(id));
    return q ? q.name : '—'; };
  function eintragText(x){
    if(x.art === 'runde')   return 'Runde ' + nameVon(x.key) + ' · ' + x.n + '×'
      + (x.weg ? ' (zurückgenommen)' : '');
    if(x.art === 'zurueck') return 'Runde zurückgenommen · ' + x.n + '×';
    if(x.art === 'einzel')  return nameZu(x.pid) + ' +1 ' + nameVon(x.key);
    if(x.art === 'minus')   return nameZu(x.pid) + ' −1 ' + (x.key ? nameVon(x.key) : '');
    if(x.art === 'sammel')  return nameZu(x.pid) + ' von Hand gesetzt';
    if(x.art === 'foto')    return 'Foto · ' + x.n + ' Strichlisten';
    return '';
  }
  const buch = (ort.log || []);
  const vorigeRunde = letzteRundeIm(ort);
  const letzterX = buch.length ? buch[buch.length-1] : null;
  const letzteEintrag = letzterX
    ? {txt:eintragText(letzterX), t:letzterX.t,
       wer:letzterX.wer || geraetName(letzterX.gid)} : null;
  const verlauf = buch.length
    ? '<details class="klapp"><summary>Verlauf an dieser Location · ' + buch.length + '</summary>'
      + [...buch].reverse().map(x => '<div class="vzeile' + (x.weg ? ' durch' : '') + '">'
          + '<span class="vzeit">' + zeitKurz(x.t) + '</span>'
          + '<span class="vtxt">' + esc(eintragText(x)) + '</span>'
          + ((x.wer || geraetName(x.gid))
              ? '<span class="vwer">' + esc(x.wer || geraetName(x.gid)) + '</span>' : '')
          + '</div>').join('')
      + '<p class="hinweis" style="margin:10px 2px 0">Protokoll der Eingaben, nicht der Endstand – '
      + 'wer später über die Sammel-Eingabe korrigiert, taucht hier nur als „von Hand gesetzt“ auf.</p>'
      + '</details>'
    : '';
  const pille = '<div class="wahl"><button class="pille" data-tu="wahlAuf" aria-expanded="'+(auf?'true':'false')+'">'
    + '<span class="pille-name">' + nameVon(wahlKey()) + '</span>'
    + '<span class="pille-be">' + zahl(beVon(wahlKey()),2) + ' BE</span>'
    + '<span class="pille-pfeil">' + (auf ? '⌃' : '⌄') + '</span></button>'
    + (auf ? '<div class="wahl-auf"><div class="wahl-titel">Stärke</div>'
        + '<div class="chips">' + wahlS + '</div>'
        + '<div class="wahl-titel" style="margin-top:10px">Größe</div>'
        + '<div class="chips">' + wahlG + '</div>'
        + '<button class="erklaerlink" data-tu="erklaerAuf" data-was="be">'
        + 'Was bedeutet BE?</button></div>' : '')
    + (rueck
        ? '<div class="rueckband"><span>Rückblick · ' + esc(tg.label) + ', '
          + esc(ort.name || 'Location ' + (pos+1)) + '</span>'
          + '<button data-tu="entsperren">Hier weiterzählen</button></div>'
        : rundeFrage && vorigeRunde
        ? '<button class="rundeknopf warnung2" data-tu="runde">Vor '
          + Math.max(1,Math.floor((Date.now()-vorigeRunde.t)/60000))
          + ' Min gab es schon eine – nochmal tippen</button>'
        : '<button class="rundeknopf" data-tu="runde"' + (hier.length ? '' : ' disabled') + '>'
          + '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
          + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
          + '<path d="M6 3h11l-1 15a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3z"/>'
          + '<path d="M17 7h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/></svg>'
          + 'Runde für alle<span>' + hier.length + '×</span></button>')
    + (!rueck && letzteRunde && letzteRunde.ortId === ort.id
        ? '<button class="rundezurueck" data-tu="rundeZurueck">↶ Runde zurücknehmen · '
          + letzteRunde.ids.length + '× ' + esc(nameVon(letzteRunde.key)) + '</button>' : '')
    + (letzteEintrag
        ? '<div class="zuletzt">Zuletzt ' + esc(letzteEintrag.txt) + ' · '
          + zeitKurz(letzteEintrag.t) + ' · ' + vorWie(letzteEintrag.t)
          + (letzteEintrag.wer ? ' · ' + esc(letzteEintrag.wer) : '') + '</div>'
        : '')
    + '</div>';

  const zeilen = hier.map(id => {
    const p = state.spieler.find(x => String(x.id) === String(id));
    if(!p) return '';
    const gs = ort.getraenke[id] || [];
    const mix = mischung(gs);
    return '<div class="pzeile"><div class="pinfo">'
      + (rueck
          ? '<div class="pname nurlesen">' + esc(p.name) + '</div>'
          : '<button class="pname" data-tu="blattAuf" data-id="'+id+'">' + esc(p.name) + '</button>')
      + '<div class="pmeta"><span class="pbe">'
      + zahl(gs.reduce((s,k) => s + beVon(k), 0),2) + ' BE</span>'
      + (mix ? '<span>' + mix + '</span>' : '<span>noch nichts</span>')
      + deltaChip(erg[id] ? erg[id].delta : null,
          erg[id] ? ' data-tu="rechnungTag" data-id="'+id+'"' : '') + '</div></div>'
      + (rueck ? ''
          : '<button class="zurueck" data-tu="minus" data-id="'+id+'" ' + (gs.length?'':'disabled')
            + ' aria-label="Zurücknehmen bei '+esc(p.name)+'">↶</button>'
            + '<button class="plus" data-tu="strich" data-id="'+id+'" aria-label="Getränk für '
            + esc(p.name)+'">+</button>')
      + '</div>';
  }).join('');

  const imWe = id => we.dabei.some(x => String(x) === String(id));
  const fehlen = state.spieler.filter(p => !hier.some(h => String(h) === String(p.id)))
    .sort((a,b) => (imWe(b.id) ? 1 : 0) - (imWe(a.id) ? 1 : 0));

  const dazu = '<details class="klapp"><summary>Wer ist noch dazugestoßen?</summary>'
    + (fehlen.length ? '<div class="teiln">'
        + fehlen.map(p => '<button data-tu="ortRein" data-id="'+p.id+'">+ ' + esc(p.name)
            + (imWe(p.id) ? '' : ' <span class="neuzugang">neu</span>') + '</button>').join('')
        + '</div>' : '')
    + '<div class="feld"><input id="gastName" placeholder="Neuer Name" autocomplete="off">'
    + '<button data-tu="gastRein">Anlegen</button></div>'
    + '<p class="hinweis" style="margin:8px 2px 0">Wird ab dieser Location mitgezählt, '
    + 'frühere Tage bleiben unberührt.</p></details>';

  const beOrt = hier.reduce((s,id) => s + (ort.getraenke[id]||[]).reduce((x,k) => x + beVon(k), 0), 0);
  const beTag = Object.keys(erg).reduce((s,id) => s + erg[id].be, 0);

  const punkte = k.map((x,i) => '<span class="kpunkt' + (i === pos ? ' an' : '')
    + (x.tagId !== (k[i-1] && k[i-1].tagId) && i > 0 ? ' neuertag' : '') + '"></span>').join('');
  const navi = k.length > 1
    ? '<div class="kettennavi">'
      + '<button data-tu="zurueckOrt"' + (pos === 0 ? ' disabled' : '') + ' aria-label="Vorherige Location">‹</button>'
      + '<div class="kpunkte">' + punkte + '</div>'
      + '<button data-tu="vorOrt"' + (pos === k.length-1 ? ' disabled' : '') + ' aria-label="Nächste Location">›</button>'
      + '</div>'
    : '';

  return pille + navi + zeilen + (rueck ? '' : dazu) + verlauf
    + '<p class="hinweis" style="margin:14px 2px 0">' + hier.length + ' hier · '
    + zahl(beOrt,2) + ' BE an dieser Location · ' + zahl(beTag,2) + ' BE am ganzen '
    + esc(tg.label) + '</p>'
    + (rueck ? '' : '<div class="weiter">'
        + '<button data-tu="ortNeu"><i>+</i>Location</button>'
        + '<button data-tu="tagNeu"><i>+</i>Tag</button></div>'
        + '<button class="knopf voll" data-tu="weSchliessen">Wochenende abschließen</button>')
    + '<div class="kleinreihe">'
    + (tg.orte.length > 1 ? gefahr('ortWeg', ort.id, 'Location löschen', '') : '')
    + (we.tage.length > 1 ? gefahr('tagWeg', tg.id, 'Tag löschen', '') : '')
    + gefahr('weWeg', we.id, 'Wochenende verwerfen', '') + '</div>';
}

/* ---------- Sammel-Eingabe ---------- */
function kombiZeilen(z, tuPlus, tuMinus, extra){
  const belegt = KOMBIS.filter(k => (z[k] || 0) > 0);
  if(!belegt.length) return '<p class="mini" style="margin:10px 2px">Noch nichts eingetragen.</p>';
  return belegt.map(k => '<div class="sortzeile">'
    + '<div class="sname">' + nameVon(k) + '<em>' + zahl(beVon(k),2) + ' BE</em></div>'
    + '<button class="rundknopf" data-tu="'+tuMinus+'" data-k="'+k+'"'+(extra||'')

function bildVerkleinern(datei, max){
  return new Promise((loesen, ablehnen) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        loesen(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => ablehnen(new Error('Bild lässt sich nicht öffnen'));
      img.src = fr.result;
    };
    fr.onerror = () => ablehnen(new Error('Datei lässt sich nicht lesen'));
    fr.readAsDataURL(datei);
  });
}

   Formatvorgaben im Text noch ein Nachputzen der Antwort. */
const KI_SCHEMA = {
  type:'object',
  properties:{
    eintraege:{
      type:'array',
      items:{
        type:'object',
        properties:{
          name:{type:'string'},
          gruppen:{
            type:'array',

                striche:{type:'integer'}
              },

              additionalProperties:false
            }
          }
        },
        required:['name','gruppen'],
        additionalProperties:false
      }
    },
    sicherheit:{type:'string', enum:['hoch','mittel','niedrig']},
    hinweis:{type:'string'}
  },
  required:['eintraege','sicherheit','hinweis'],
  additionalProperties:false
};
const KI_MODELLE = [
  {k:'claude-opus-5',  n:'Opus 5'},
  {k:'claude-sonnet-5', n:'Sonnet 5'}
];
const kiModell = () => (state.einst && state.einst.kiModell) || 'claude-opus-5';
const kiSchluessel = () => (state.einst && state.einst.kiSchluessel || '').trim();

async function anKI(bild, anweisung){
  const schluessel = kiSchluessel();
  if(!schluessel)
    throw new Error('Es ist kein Zugangsschlüssel für die Zählung hinterlegt. '
      + 'Einer genügt für die ganze Gruppe – hinterlegt wird er hinterm Zahnrad.');
  let r;
  try{
    r = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':schluessel,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:kiModell(), max_tokens:2000,
        output_config:{format:{type:'json_schema', schema:KI_SCHEMA}},
        messages:[{role:'user', content:[
          {type:'image', source:{type:'base64', media_type:'image/jpeg', data:bild.split(',')[1]}},
          {type:'text', text:anweisung}
        ]}]
      })
    });
  }catch(e){ throw new Error('Keine Verbindung zur Zählung – Netz prüfen'); }
  if(r.status === 401 || r.status === 403)
    throw new Error('Der Zugangsschlüssel für die Zählung wird nicht angenommen. '
      + 'Vermutlich abgelaufen oder zurückgezogen – hinterm Zahnrad neu hinterlegen.');
  if(r.status === 429)
    throw new Error('Das Zähl-Guthaben ist aufgebraucht oder das Monatslimit erreicht. '
      + 'Die Striche lassen sich weiter von Hand eintragen.');
  if(!r.ok) throw new Error('Die Zählung ist nicht durchgekommen (Fehler ' + r.status + ')');
  const d = await r.json();
  if(d.stop_reason === 'refusal') throw new Error('Die Zählung wurde abgelehnt');
  const text = (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  try{ return JSON.parse(text); }
  catch(e){ throw new Error('Antwort nicht lesbar'); }
}

/* Nur wer an dieser Location eingetragen ist, kommt als Treffer in Frage. Ein Name,
   der hier nicht dabei sein kann, ist eher verlesen als anwesend. */
function nameZuId(name, nur){
  const n = String(name || '').trim().toLowerCase();
  if(!n) return null;
  const kreis = Array.isArray(nur)
    ? state.spieler.filter(p => nur.some(id => String(id) === String(p.id)))
    : state.spieler;
  const genau = kreis.find(p => p.name.toLowerCase() === n);
  if(genau) return genau.id;
  const teil = kreis.find(p => p.name.toLowerCase().startsWith(n) || n.startsWith(p.name.toLowerCase()));
  return teil ? teil.id : null;
}
/* Was ohne Namen notiert ist, gehört der Runde: gleichmäßig auf die Anwesenden.
   Was nicht aufgeht, bleibt als Rest stehen – geraten wird nichts. */
function aufteilen(summe, ids){
  const je = {}, rest = {};
  ids.forEach(id => je[id] = leereZaehlung());
  KOMBIS.forEach(k => {
    const n = Math.max(0, Math.round(summe[k] || 0));
    if(!n) return;
    if(!ids.length){ rest[k] = n; return; }
    const proKopf = Math.floor(n / ids.length);
    if(proKopf) ids.forEach(id => je[id][k] = proKopf);
    const uebrig = n - proKopf * ids.length;
    if(uebrig) rest[k] = uebrig;
  });
  return {je, rest};
}
function fotoTrefferFuer(id){
  let t = foto.treffer.find(x => String(x.ziel) === String(id));
  if(!t){
    const p = state.spieler.find(x => String(x.id) === String(id));
    t = {name:p ? p.name : '—', ziel:id, z:leereZaehlung()};
    foto.treffer.push(t);
  }
  return t;
}
/* Baut die Zuordnung aus dem Gelesenen neu auf. Läuft nach dem Foto und noch einmal,
   wenn jemand sagt, dass das Namenlose doch ihm allein gehört. */
function fotoVerteilen(){
  const {ort} = aktuell();
  const hier = ort ? Object.keys(ort.getraenke) : [];
  foto.treffer = [];
  (foto.benannt || []).forEach(e => {
    const t = fotoTrefferFuer(e.ziel);
    KOMBIS.forEach(k => t.z[k] += e.z[k] || 0);
  });
  const topf = foto.ohne || leereZaehlung();
  const alleinIst = foto.ohneZiel && hier.some(id => String(id) === String(foto.ohneZiel));
  if(alleinIst){
    const t = fotoTrefferFuer(foto.ohneZiel);
    KOMBIS.forEach(k => t.z[k] += topf[k] || 0);
    foto.rest = {};
  } else {
    const {je, rest} = aufteilen(topf, hier);
    hier.forEach(id => {
      const anteil = je[id];
      if(anteil && KOMBIS.some(k => anteil[k])){
        const t = fotoTrefferFuer(id);
        KOMBIS.forEach(k => t.z[k] += anteil[k]);
      }
    });
    foto.rest = rest;
  }
}
const topfLeer = t => !KOMBIS.some(k => (t || {})[k] > 0);

function gruppenLesen(gruppen){
  const z = leereZaehlung();
  (Array.isArray(gruppen) ? gruppen : []).forEach(gr => {
    const n = Math.max(0, Math.round(Number(gr && gr.striche) || 0));

}

    p, elo:R[p.id],
    be: tagTeil[p.id] ? beSumme[p.id]/tagTeil[p.id] : 0,
    siege: siege[p.id], liter: liter[p.id], literAf: literAf[p.id], tage: tagTeil[p.id],
    we: weTeil[p.id], orte: ortTeil[p.id],
    d: (letztes && letztes.tagLog.some(t => t.erg[p.id]))
        ? letztes.nachher[p.id] - letztes.vorher[p.id] : null,
    weId: letztes ? letztes.we.id : null
  }));
}

function rangZeilen(){
  const sk = state.sortier || 'elo';
  const sp = SPALTEN.find(x => x.k === sk) || SPALTEN[0];
  const zweit = sk === 'elo' ? SPALTEN[1] : sp;
  const liste = rangDaten().sort((a,b) => b[sk] - a[sk] || b.elo - a.elo);

  const chips = SPALTEN.map(x => '<button class="chip mini-chip" data-tu="sortieren" data-k="'+x.k
    + '" data-an="' + (sk === x.k ? 1 : 0) + '">' + x.kurz + '</button>').join('');

  const kopf = '<div class="rangkopf">'
    + '<span class="rknr"></span>'
    + '<span class="rkname">Name</span>'
    + '<button class="rkwert" data-tu="erklaerAuf" data-was="' + zweit.was + '">'
    + zweit.kopf + ' <i>?</i></button>'
    + '<button class="rkelo" data-tu="punkteInfo">Punkte <i>?</i></button></div>';

  const zeilen = liste.map((x,i) => {
    const wert = zweit.k === 'be' ? zahl(x.be,2)
               : zweit.k === 'liter' ? zahl(x.liter,1)
               : String(x[zweit.k]);
    const neben = [];
    SPALTEN.forEach(c => {
      if(c.k === 'elo' || c.k === zweit.k) return;
      neben.push((c.k === 'be' ? 'Ø ' + zahl(x.be,2) + ' BE'
                : c.k === 'liter' ? zahl(x.liter,1) + ' L'
                : c.k === 'siege' ? x.siege + ' ' + (x.siege===1?'Sieg':'Siege')
                : x.tage + ' ' + (x.tage===1?'Tag':'Tage')));
    });
    if(x.literAf > 0) neben.push(zahl(x.literAf,1) + ' L alkfrei');
    const attrs = (x.d !== null && x.weId)
      ? ' data-tu="rechnungWe" data-id="'+x.p.id+'" data-we="'+x.weId+'"' : '';
    return '<div class="rang ' + (x.tage === 0 ? 'ruht' : '') + '">'
      + '<span class="rnr ' + (i===0?'eins':'') + '">' + (i+1) + '</span>'
      + '<button class="rmitte" data-tu="personAuf" data-id="'+x.p.id+'">'
      + '<div class="rname">' + esc(x.p.name) + '</div>'
      + '<div class="rmeta">' + neben.join(' · ') + '</div></button>'
      + '<span class="rwert">' + wert + '</span>'
      + '<span class="relospalte">' + deltaChip(x.d, attrs)
      + '<span class="relo2">' + Math.round(x.elo) + '</span></span></div>';
  }).join('');

  return '<div class="sortreihe"><span>Sortieren nach</span><div class="chips">' + chips
    + '</div></div>' + kopf + zeilen;
}

function ansichtArchiv(){
  const {log} = berechnen();
  const offen = state.we.find(w => w.id === state.aktivWe);

  const start = offen
    ? '<button class="knopf voll" data-tu="geheZaehlen">Zurück zu „' + esc(offen.titel) + '“</button>'
    : '<button class="knopf voll" data-tu="weNeu">Wochenende eröffnen</button>';

  if(!state.spieler.length){
    return start + '<div class="leerzustand"><h2>Wer trinkt mit?</h2>'
      + '<p>Trag die Bubidos ein. Alle starten bei 1500 Punkten.</p>'
      + '<div class="feld" style="max-width:360px;margin:18px auto 0">'
      + '<input id="neuName" placeholder="Name" autocomplete="off">'
      + '<button data-tu="spielerRein">Rein</button></div></div>';
  }

  const echte = [...log.filter(e => e.tagLog.length && e.we.id !== state.aktivWe)].reverse();
  const wochenenden = echte.length
    ? echte.map(e => {
        const f = fazitVon(e);
        const sieger = f.orden.length ? f.orden[0].w : '—';
        return '<button class="weZeile" data-tu="weDetail" data-id="'+e.we.id+'">'
          + '<div class="wztext"><div class="wzname">' + esc(e.we.titel) + '</div>'
          + '<div class="wzmeta">' + datumHuebsch(e.we.datum) + ' · ' + f.tage + ' '
          + (f.tage===1?'Tag':'Tage') + ' · ' + f.orteGesamt + ' Locations · '
          + zahl(f.gesLiter) + ' L</div>'
          + '<div class="wzsieger">Deckelkönig ' + esc(sieger) + '</div></div>'
          + '<span class="wzpfeil">›</span></button>';
      }).join('')
    : '<p class="hinweis" style="margin:8px 2px">Noch nichts abgeschlossen. Das erste Wochenende '
      + 'landet hier, sobald ihr es beendet.</p>';

  return start
    + '<div class="abschnitt oben">Tabelle</div>' + rangZeilen()
    + '<p class="hinweis">Gewertet wird je Tag über alle Locations · K ' + state.einst.k
    + (state.einst.deckel > 0 ? ' · Deckel ' + zahl(state.einst.deckel,1) + ' BE' : '') + '</p>'
    + '<div class="abschnitt">Wochenenden</div>' + wochenenden;
}

function ansichtWeDetail(id){
  const {log} = berechnen();
  const e = log.find(x => x.we.id === id);
  if(!e) return '<p class="hinweis">Dieses Wochenende gibt es nicht mehr.</p>';
  const f = fazitVon(e);
  const details = e.tagLog.map(t => {
    const ids = Object.keys(t.erg).sort((x,y) => t.erg[y].be - t.erg[x].be);
    const stationen = t.tag.orte.map((o,i) => esc(o.name || (i+1)+'. Station')).join(' → ');
    return '<p class="hinweis" style="margin:10px 2px 0"><b>' + esc(t.tag.label) + '</b> · '
      + stationen + '<br>' + ids.map(id2 => {
          const p = state.spieler.find(x => String(x.id) === String(id2));
          return esc(p ? p.name : '—') + ' ' + zahl(t.erg[id2].be,2);
        }).join(' · ') + ' BE</p>';
  }).join('');
  return fazitBlock(f, false) + details
    + '<button class="knopf leer" data-tu="weOeffnen" data-id="'+e.we.id+'">Wieder öffnen</button>'
    + gefahr('weLoeschen', e.we.id, 'Wochenende löschen', 'knopf gefahr');
}

        + strichliste(3) + '</span></div>'
        + '<div class="dbsp-txt">3 × Stark 0,33 — das klassische IPA. 2,76 BE.</div></div>'
      + '<div class="dbsp"><div class="dbsp-titel">Zwei Blöcke gemischt</div>'
        + '<div class="dbsp-bild">' + strichliste(3)
        + '<span style="margin:0 6px">·</span>M<span class="dbsp-strich">' + strichliste(2)
        + '</span></div>'
        + '<div class="dbsp-txt">3 Halbe und 2 Maß. Getrennte Blöcke, damit klar bleibt, '
        + 'was wozu gehört.</div></div>'
    + '</div>'
    + '<div class="warnung" style="margin-top:12px"><p><strong>Die Eins ist die Falle.</strong> '
    + 'Eine notierte 1 für den Liter sieht aus wie ein Zählstrich. Schreibt sie deutlich abgesetzt '
    + 'neben den Block, nicht davor — oder nehmt gleich das M für Maß, dann kann nichts passieren. '
    + 'Dasselbe gilt für das L: es heißt hier <em>leicht</em> und nie Liter.</p></div>'
    + '<p>Die gezählten Zahlen kommen mit Plus und Minus zurück. Das ist keine Höflichkeit, sondern der '
    + 'eigentliche Arbeitsschritt: Bierflecken gelten gelegentlich als Strich. Was fehlt, lässt sich über '
    + '„Weitere Sorte eintragen" ergänzen. Fotos werden nicht gespeichert.</p>'
    + '<p>Die Zählung braucht einen Zugangsschlüssel, der hinterm Zahnrad hinterlegt wird. Er liegt '
    + 'im gemeinsamen Datenbestand, also genügt einer für die ganze Gruppe — die übrigen Geräte '
    + 'bekommen ihn beim nächsten Laden. Fehlt er, sagt die App das und ihr tippt von Hand. Welches '
    + 'Modell zählt, steht ebenfalls dort; beide können es, und wer vergleichen will, fotografiert '
    + 'denselben Deckel zweimal.</p></div>'

    + '<div class="para" id="p6"><h2><i>§ 6</i> Ordensverleihung</h2>'
    + '<table class="info">'
    + '<tr><td class="wert">Deckelkönig</td><td>Die meisten Biereinheiten über das ganze Wochenende. '
    + 'Belohnt die Menge — und damit zwangsläufig auch, wer am längsten da war.</td></tr>'
    + '<tr><td class="wert">Schlagzahl</td><td>Der höchste Schnitt je Tag. Der Gegenpol zum '
    + 'Deckelkönig: wer erst am Samstag anreist und dann abliefert, ist hier voll dabei.</td></tr>'
    + '<tr><td class="wert">Aufsteiger</td><td>Größter Punktgewinn. Geht auffällig oft an Leute, die '
    + 'vorher hinten lagen. Das ist kein Fehler, das ist Elo.</td></tr>'
    + '<tr><td class="wert">Gleichmaß</td><td>Geringste Schwankung zwischen den Tagen. Die stille '
    + 'Auszeichnung für alle, die auch am Sonntag noch reden können.</td></tr>'
    + '<tr><td class="wert">Durchhalter</td><td>An jedem Tag dabei und bei den meisten Locations. '
    + 'Der einzige Orden, den man nicht ertrinken kann — nur ersitzen.</td></tr></table>'
    + '<p><strong>Zur unterschiedlichen Anreise:</strong> Wer einen Tag verpasst, verliert dadurch '
    + 'keine Punkte — er kommt in der Wertung dieses Tages schlicht nicht vor. Im Fazit steht bei '
    + 'jedem, an wie vielen Tagen er dabei war, und neben der Gesamtmenge der Schnitt je Tag. '
    + 'Damit lassen sich Freitagsanreisende und Samstagsanreisende nebeneinander lesen, ohne dass '
    + 'die eine Zahl die andere erschlägt.</p></div>'

    + '<div class="para" id="p7"><h2><i>§ 7</i> Technische Daten</h2>'
    + '<p>Eine Biereinheit ist Liter mal Volumenprozent geteilt durch 2,5. Eine Halbe Helles ergibt damit '
    + 'exakt 1,00 — der Rest folgt daraus.</p>'
    + '<p>Sorte und Menge sind getrennt: die <strong>Stärkeklasse</strong> liefert die Prozente, '
    + 'die <strong>Größe</strong> die Liter. Vier mal drei ergibt zwölf Kombinationen aus sieben Knöpfen.</p>'
    + '<table class="info">'
    + '<tr><td class="frage"></td><td class="wert">0,33</td><td class="wert">0,5</td><td class="wert">1,0</td></tr>'
    + '<tr><td class="frage">Leicht, 3 %</td><td class="wert">0,40</td><td class="wert">0,60</td><td class="wert">1,20</td></tr>'
    + '<tr><td class="frage">Normal, 5 %</td><td class="wert">0,66</td><td class="wert">1,00</td><td class="wert">2,00</td></tr>'
    + '<tr><td class="frage">Stark, 7 %</td><td class="wert">0,92</td><td class="wert">1,40</td><td class="wert">2,80</td></tr>'
    + '<tr><td class="frage">Alkoholfrei</td><td class="wert">0,00</td><td class="wert">0,00</td><td class="wert">0,00</td></tr></table>'
    + '<p class="mini" style="margin:0 2px 10px">Normal 0,5 heißt in der App <em>Halbe</em>, '
    + 'Normal 1,0 heißt <em>Maß</em>. Über 8 % wird untertrieben — ein Doppelbock zählt wie ein '
    + 'gewöhnliches Starkbier.</p>'

    + '<p>Jeder <strong>Tag</strong> ist ein Turnier, jeder gegen jeden. Für jedes Paar wird gerechnet:</p>'
    + '<div class="formel">'
      + '<div class="fz"><span class="fl">Anteil</span>'
      + '<span class="fm">S = BE<sub>A</sub> ÷ (BE<sub>A</sub> + BE<sub>B</sub>)</span>'
      + '<span class="fk">Wie viel vom gemeinsamen Konsum ging auf A? Haben beide null, gilt 0,5.</span></div>'
      + '<div class="fz"><span class="fl">Erwartung</span>'
      + '<span class="fm">E = 1 ÷ (1 + 10<sup>(R<sub>B</sub> − R<sub>A</sub>) ÷ 400</sup>)</span>'
      + '<span class="fk">Was war laut Tabellenstand zu erwarten? Gleiche Punkte heißt E = 0,5.</span></div>'
      + '<div class="fz"><span class="fl">Änderung</span>'
      + '<span class="fm">Δ = K ÷ (n − 1) × Σ (S − E)</span>'
      + '<span class="fk">Summiert über alle Gegner des Tages. n ist die Zahl der Leute an dem Tag.</span></div>'
    + '</div>'

    + '<p class="mini" style="margin:14px 2px 6px">Durchgerechnet, zwei Personen, beide bei 1500:</p>'
    + '<table class="info">'
    + '<tr><td>Fiffi trinkt 3 Halbe + 1 Pils</td><td class="wert">3,63 BE</td></tr>'
    + '<tr><td>David trinkt 2 Halbe</td><td class="wert">2,00 BE</td></tr>'
    + '<tr><td>Anteil Fiffi: 3,63 ÷ 5,63</td><td class="wert">S = 0,645</td></tr>'
    + '<tr><td>Anteil David: 2,00 ÷ 5,63</td><td class="wert">S = 0,355</td></tr>'
    + '<tr><td>Erwartung bei Gleichstand</td><td class="wert">E = 0,500</td></tr>'
    + '<tr><td>Fiffi: 40 × (0,645 − 0,500)</td><td class="wert">+5,8</td></tr>'
    + '<tr><td>David: 40 × (0,355 − 0,500)</td><td class="wert">−5,8</td></tr></table>'
    + '<p>Fiffi hat nicht doppelt so viel getrunken, sondern rund zwei Drittel des gemeinsamen '
    + 'Konsums — deshalb wechseln knapp 6 Punkte den Besitzer und nicht 20. Was einer verliert, '
    + 'gewinnt der andere; die Summe bleibt immer null.</p>'
    + '<p>Weicht eure Zahl davon ab, lag der Tabellenstand vorher nicht gleichauf, es war noch jemand '
    + 'dabei, oder es kamen mehrere Locations zusammen. Nachrechnen lohnt sich: alles oben steht fest '
    + 'in der App, nichts davon ist Zufall.</p>'

    + '<p><strong>Der K-Faktor</strong> ist der Ausschlag. Weil (S − E) nie größer als 0,5 wird, ist '
    + '<strong>K ÷ 2 die höchstmögliche Verschiebung je Duell</strong> — bei K = 40 also 20 Punkte. '
    + 'Klein gewählt (10) bewegt sich die Tabelle über Jahre kaum; groß gewählt (100) wird sie nach '
    + 'jedem Wochenende neu gemischt und alte Ergebnisse zählen nichts mehr. Bei sechs bis neun '
    + 'Wertungen im Jahr braucht es ein hohes K, sonst stünden nach drei Jahren noch alle bei 1500. '
    + 'Deshalb ab Werk 40. Der Regler steht unter <strong>Runde</strong> und rechnet die gesamte '
    + 'Historie sofort neu — Ausprobieren kostet nichts.</p>'

    + '<p>Wer unten steht, gewinnt viel: seine Erwartung ist niedrig, jeder Erfolg überrascht. Wer oben '
    + 'steht, muss liefern, um zu halten. Und wer an einem Tag fehlt, verliert nichts — er kommt in der '
    + 'Wertung dieses Tages schlicht nicht vor.</p></div>'

    + '<div class="para" id="p8"><h2><i>§ 8</i> Datenschutz</h2>'
    + '<p>App und Daten liegen getrennt. Die App selbst steht öffentlich auf GitHub Pages — '
    + '<strong>jeder mit dem Link</strong> kann sie öffnen und den Code lesen. Die Tabelle bekommt '
    + 'er damit nicht zu sehen: Die Daten liegen in einem <strong>privaten</strong> Repository, und '
    + 'ohne Zugriffsschlüssel zeigt die App nur den Verbinden-Bildschirm.</p>'
    + '<p>Gespeichert werden Namen, Getränke und Locations, bei GitHub. Der Schlüssel liegt auf dem '
    + 'jeweiligen Gerät und wird an niemanden sonst weitergereicht. Wer ihn hat, darf lesen und '
    + 'schreiben — abgestufte Rechte je Person gibt es nicht.</p>'
    + '<p><strong>Praktisch heißt das:</strong> Schlüssel nur in der Gruppe weitergeben, keine '
    + 'Klarnamen wo Vornamen reichen, und nichts eintragen, was niemanden etwas angeht.</p></div>'

    + '<div class="para" id="p9"><h2><i>§ 9</i> Sicherung</h2>'
    + '<p>Die Daten liegen in einem eigenen Repository, und <strong>jede Änderung wird dort ein '
    + 'Commit</strong>. Überschrieben wird nichts, jeder frühere Stand bleibt abrufbar. Darauf '
    + 'setzen drei Ebenen auf:</p><ul>'
    + '<li><strong>Bei jeder Eingabe:</strong> Der Stand wandert in die Historie. Über '
    + '„Historie auf GitHub öffnen“ hinterm Zahnrad ist jeder Zwischenstand nachlesbar.</li>'
    + '<li><strong>Bei gleichzeitigem Tippen:</strong> Schreiben zwei Handys im selben Moment, '
    + 'wird der fremde Stand geholt und der eigene daraufgesetzt. Beide Fassungen stehen danach '
    + 'in der Historie — es geht nichts verloren.</li>'
    + '<li><strong>Auf jedem Gerät</strong> läuft eine stille Nebenkopie des letzten Stands mit, '
    + 'damit die App auch ohne Netz startet.</li></ul>'
    + '<p>Eine Erinnerung nach jedem Wochenende gibt es deshalb nicht mehr. Der <strong>Export</strong> '
    + 'hinterm Zahnrad bleibt trotzdem: Er ist die einzige Kopie außerhalb von GitHub und damit das '
    + 'Mittel gegen den Fall, dass das Repository selbst wegfällt. Einmal im Jahr genügt.</p>'
    + '<p>Zurückholen geht über <strong>Stand wiederherstellen</strong>: Text einfügen, prüfen, '
    + 'übernehmen. Vorher wird der jetzige Stand automatisch gesichert. Der Löschknopf bleibt '
    + 'gesperrt, solange in dieser Sitzung nicht exportiert wurde.</p></div>'

    + '<div class="para" id="p10"><h2><i>§ 10</i> Störungsbehebung</h2>'
    + '<table class="info">'
    + '<tr><td class="frage">Das Foto meldet 47 Striche</td><td>Entweder galt ein Bierfleck als Strich, '
    + 'oder ihr wart fleißig. Mit Minus korrigieren. Bei 47 bitte auch § 2 nochmals lesen.</td></tr>'
    + '<tr><td class="frage">Das Foto sagt, es fehle ein Zugangsschlüssel</td>'
    + '<td>Dann ist keiner hinterlegt oder er wurde zurückgezogen. Hinterm Zahnrad unter '
    + '<em>Foto-Zählung</em> einen eintragen — einer genügt für alle Geräte. Bis dahin von Hand '
    + 'tippen, das geht ja auch.</td></tr>'
    + '<tr><td class="frage">Jemand hat am meisten getrunken und kaum Punkte gewonnen</td>'
    + '<td>Keine Störung. Von oben wird das erwartet — E ist hoch, also bleibt (S − E) klein. '
    + 'Rechenweg steht in § 7, das lässt sich am Tisch nachprüfen.</td></tr>'
    + '<tr><td class="frage">Wir waren in fünf Kneipen, es gibt aber nur eine Wertung</td>'
    + '<td>Bestimmungsgemäß, siehe § 3. Die Locations stecken im Tag, nicht daneben.</td></tr>'
    + '<tr><td class="frage">Die Tabelle steht auf dem anderen Handy anders</td><td>Im Archiv oben '
    + 'rechts auf den Kreispfeil tippen holt den Stand sofort.</td></tr>'
    + '<tr><td class="frage">Wo ist die Tabelle während des Abends?</td><td>Oben rechts das '
    + 'Balkensymbol. Von dort führt ein Knopf zurück zum laufenden Wochenende.</td></tr></table></div>'

    + '<div class="para" id="p11"><h2><i>§ 11</i> Gewährleistung</h2>'
    + '<p>Garantiert wird die korrekte Anwendung der Elo-Formel. Nicht garantiert werden der Hausfrieden, '
    + 'die Richtigkeit handschriftlicher Strichlisten nach dem vierten Bier und das Zustandekommen des '
    + 'nächsten Wochenendes.</p>'
    + '<p>Ansprüche aus § 6 sind nicht in Bargeld ablösbar. Der Rechtsweg ist ausgeschlossen, die '
    + 'Diskussion am Tisch ausdrücklich nicht.</p></div>'

    + '<div class="siegel"><div class="gross">Geprüft<br>am Tisch</div>'
    + '<div class="klein">Fünf Bubidos<br>Eine Tabelle</div></div>'
    + '<p class="hinweis" style="text-align:center">Betriebsanleitung, Ausgabe 7 · Änderungen im Sinne '
    + 'des technischen Fortschritts vorbehalten<br><b style="color:var(--malz)">Fassung '
    + FASSUNG + '</b></p>';
}

}

function ansichtPunkte(){

    + '<div class="karte" role="dialog" aria-label="Was die Punktzahl bedeutet">'

    + '<p class="erkl"><b>Alle starten bei 1500.</b> Die Zahl misst nicht, wie viel jemand '
    + 'getrunken hat, sondern wie oft er mehr getrunken hat <i>als von ihm erwartet war</i>.</p>'
    + '<p class="erkl">Nach jedem Tag wechseln Punkte zwischen denen, die zusammen am Tisch saßen. '
    + 'Wer mehr als seinen Anteil trinkt, gewinnt — wer weniger trinkt, verliert. Was der eine '
    + 'gewinnt, verliert der andere, die Summe bleibt immer null.</p>'
    + '<p class="erkl">Je höher jemand steht, desto mehr wird von ihm erwartet. Ein Tabellenführer '

    + 'viel. Deshalb ist die Tabelle nie entschieden.</p>'

    + 'Tages einfach nicht vor.</p>'
    + '<button class="knopf leer" data-tu="geheInfoAusBlatt" data-para="p7">'
    + 'Ganze Erklärung in § 7</button>'
    + '<button class="knopf voll" data-tu="punkteZu">Verstanden</button>'
    + '</div></div></div>';
}

function ansichtRechnung(){
  if(!rechnung) return '';
  const {log} = berechnen();
  const e = log.find(x => x.we.id === rechnung.weId);
  const p = state.spieler.find(x => String(x.id) === String(rechnung.id));
  if(!e || !p) return '';
  const nam = id => { const q = state.spieler.find(x => String(x.id) === String(id));
    return esc(q ? q.name : '—'); };
  let inhalt;

  if(rechnung.tagId){
    const tl = e.tagLog.find(t => t.tag.id === rechnung.tagId);
    if(!tl) return '';
    const erg = tl.erg, ids = Object.keys(erg);
    const meiner = erg[rechnung.id];
    if(!meiner) return '';
    const n = ids.length, faktor = n >= 2 ? state.einst.k/(n-1) : 0;

    const duelle = ids.filter(b => String(b) !== String(rechnung.id)).map(b => {
      const ges = meiner.be + erg[b].be;
      const S = ges === 0 ? 0.5 : meiner.be/ges;
      const E = 1/(1 + Math.pow(10,(erg[b].vorher - meiner.vorher)/400));
      return '<tr><td>gegen ' + nam(b) + '</td>'
        + '<td class="z">' + zahl(erg[b].be,2) + '</td>'
        + '<td class="z">' + zahl(S,2) + '</td>'
        + '<td class="z">' + zahl(E,2) + '</td>'
        + '<td class="z ' + (S-E > 0 ? 'gut' : 'schlecht') + '">'
        + (S-E > 0 ? '+' : '') + zahl(faktor*(S-E)) + '</td></tr>';
    }).join('');

    const mehrTage = e.tagLog.filter(t => t.erg[rechnung.id]).length > 1;
    inhalt = (mehrTage
        ? '<button class="blattzurueck" data-tu="rechnungAlle">‹ Alle Tage</button>' : '')
      + '<h3>' + esc(p.name) + ', ' + esc(tl.tag.label) + '</h3>'
      + '<p class="mini" style="margin:2px 0 14px">' + esc(e.we.titel) + ' · '
      + n + ' am Tisch · K ' + state.einst.k + '</p>'
      + '<p class="erkl">' + esc(p.name) + ' hatte an diesem Tag <b>' + zahl(meiner.be,2)
      + ' BE</b> und stand vorher bei <b>' + Math.round(meiner.vorher) + '</b>.</p>'
      + '<table class="rechnung"><tr><th></th><th class="z">BE</th><th class="z">Anteil</th>'
      + '<th class="z">erwartet</th><th class="z">Punkte</th></tr>' + duelle + '</table>'
      + '<p class="erkl"><b>Anteil</b> ist der Anteil am gemeinsamen Konsum des Duells. '
      + '<b>Erwartet</b> ist der Anteil, den die Punktzahlen vorher nahegelegt haben. '
      + 'Die Differenz mal ' + zahl(faktor,1) + ' ergibt die Punkte.</p>'
      + '<div class="summe"><span>Summe</span><b class="' + (meiner.delta > 0 ? 'gut' : 'schlecht')
      + '">' + (meiner.delta > 0 ? '+' : '') + zahl(meiner.delta) + '</b></div>'
      + '<div class="summe"><span>neuer Stand</span><b>' + Math.round(meiner.nachher) + '</b></div>';

  } else {
    const zeilen = e.tagLog.filter(t => t.erg[rechnung.id]).map(t => {
      const g = t.erg[rechnung.id];
      return '<button class="tagzeile" data-tu="rechnungTagAus" data-id="'+rechnung.id
        + '" data-we="'+e.we.id+'" data-tag="'+t.tag.id+'">'
        + '<span class="tzn">' + esc(t.tag.label) + '</span>'
        + '<span class="tzbe">' + zahl(g.be,2) + ' BE</span>'
        + deltaChip(g.delta) + '<span class="tzp">›</span></button>';
    }).join('');
    const gesamt = e.tagLog.reduce((x,t) => x + (t.erg[rechnung.id] ? t.erg[rechnung.id].delta : 0), 0);
    inhalt = '<h3>' + esc(p.name) + ', ' + esc(e.we.titel) + '</h3>'
      + '<p class="mini" style="margin:2px 0 14px">Jeder Tag wird einzeln gewertet</p>'
      + zeilen
      + '<div class="summe"><span>ganzes Wochenende</span><b class="' + (gesamt > 0 ? 'gut' : 'schlecht')
      + '">' + (gesamt > 0 ? '+' : '') + zahl(gesamt) + '</b></div>'
      + '<p class="erkl">Tippe einen Tag an, um die Rechnung dahinter zu sehen.</p>';
  }

  return '<div class="blende" data-tu="rechnungHintergrund"><div class="blatt">'
    + '<div class="karte" role="dialog" aria-label="Rechenweg">' + inhalt
    + (rechnung.tagId && e.tagLog.filter(t => t.erg[rechnung.id]).length > 1
        ? '<button class="knopf voll" data-tu="rechnungAlle">Zurück zu allen Tagen</button>'
          + '<button class="knopf leer" data-tu="geheInfoAusBlatt" data-para="p7">Formel in § 7</button>'
          + '<button class="knopf leer" data-tu="rechnungZu">Schließen</button>'
        : '<button class="knopf leer" data-tu="geheInfoAusBlatt" data-para="p7">Formel in § 7</button>'
          + '<button class="knopf voll" data-tu="rechnungZu">Schließen</button>')
    + '</div></div></div>';
}

function ansichtBenennen(){

function ansichtZwischen(){
  const we = state.we.find(w => w.id === state.aktivWe);
  if(!we) return '<p class="hinweis">Gerade läuft kein Wochenende.</p>';
  const {R, log} = berechnen();
  const e = log.find(x => x.we.id === we.id);
  if(!e || !e.tagLog.length) return '<p class="hinweis">Noch nichts eingetragen.</p>'
    + '<button class="knopf voll" data-tu="geheZaehlen">Zurück zum Zählen</button>';

  const tage = e.tagLog.map(t => {
    const ids = Object.keys(t.erg).sort((x,y) => t.erg[y].be - t.erg[x].be);
    const best = ids.length ? t.erg[ids[0]].be : 0;
    const stationen = t.tag.orte.map((o,i) => esc(o.name || (i+1)+'. Station')).join(' → ');
    const zeilen = ids.map(id => {
      const q = state.spieler.find(x => String(x.id) === String(id));
      const sieger = best > 0 && Math.abs(t.erg[id].be - best) < 1e-9;
      return '<div class="tagrang' + (sieger ? ' sieger' : '') + '">'
        + '<span class="trn">' + (sieger ? '★' : '') + '</span>'
        + '<span class="trname">' + esc(q ? q.name : '—') + '</span>'
        + '<span class="trbe">' + zahl(t.erg[id].be,2) + ' BE</span>'
        + deltaChip(t.erg[id].delta, ' data-tu="rechnungTagAus" data-id="'+id
          + '" data-we="'+we.id+'" data-tag="'+t.tag.id+'"') + '</div>';
    }).join('');
    const ist = t.tag.id === state.aktivTag;
    return '<div class="tagblock' + (ist ? ' laeuft' : '') + '">'
      + '<div class="tagkopf"><span>' + esc(t.tag.label) + (ist ? ' · läuft' : '') + '</span>'
      + '<span class="tagorte">' + stationen + '</span></div>' + zeilen + '</div>';
  }).join('');

  const ids = [...new Set(e.tagLog.flatMap(t => Object.keys(t.erg)))];
  const gesamt = ids.map(id => {
    const q = state.spieler.find(x => String(x.id) === String(id));
    let be = 0, tage2 = 0;
    e.tagLog.forEach(t => { if(t.erg[id]){ be += t.erg[id].be; tage2++; } });
    return {id, name:q ? q.name : '—', be, tage:tage2,
            delta:(e.nachher[id]||0) - (e.vorher[id]||0), jetzt:R[id]};
  }).sort((a,b) => b.be - a.be);

  const gzeilen = gesamt.map(l => '<div class="frow"><div class="fhaupt">'
    + '<div class="fname">' + esc(l.name) + '</div>'
    + '<div class="fbe">' + zahl(l.be,2) + ' BE</div>'
    + deltaChip(l.delta, ' data-tu="rechnungWe" data-id="'+l.id+'" data-we="'+we.id+'"')
    + '<div class="fneu">' + Math.round(l.jetzt) + '</div></div>'
    + '<div class="fmeta">' + l.tage + ' von ' + e.tagLog.length + ' '
    + (e.tagLog.length===1?'Tag':'Tagen') + '</div></div>').join('');

  return '<div class="zwkopf"><div class="zwtitel">' + esc(we.titel) + '</div>'
    + '<div class="zwdatum">' + datumHuebsch(we.datum) + ' · läuft</div></div>'
    + '<div class="abschnitt oben">Tag für Tag</div>' + tage
    + '<div class="abschnitt">Bisher zusammen</div>' + gzeilen
    + '<button class="knopf voll" data-tu="geheZaehlen">Zurück zum Zählen</button>'
    + '<button class="knopf leer" data-tu="geheArchiv">Gesamttabelle ansehen</button>';
}

function ansichtPerson(){
  const p = state.spieler.find(x => String(x.id) === String(personId));
  if(!p) return '<p class="hinweis">Diese Person gibt es nicht mehr.</p>';
  const {R, weTeil, tagTeil, ortTeil, siege, beSumme, hoch, log} = berechnen();
  const oBe = tagTeil[p.id] ? beSumme[p.id]/tagTeil[p.id] : 0;
  let liter = 0, literAf = 0, getr = 0;
  log.forEach(e => e.tagLog.forEach(t => { if(t.erg[p.id]){
    liter += t.erg[p.id].liter; literAf += t.erg[p.id].literAf || 0;
    getr += t.erg[p.id].anzahl; } }));

  const orden = {};
  log.filter(e => e.tagLog.length).forEach(e => fazitVon(e).orden.forEach(o => {
    if(o.w.split(', ').some(n => n === p.name)) orden[o.t] = (orden[o.t]||0) + 1;
  }));
  const ordenZeilen = Object.keys(orden).length
    ? Object.keys(orden).map(t => '<div class="ozeile"><span>' + t + '</span><b>'
        + orden[t] + '×</b></div>').join('')
    : '<p class="hinweis" style="margin:6px 2px">Noch kein Orden.</p>';

  const wes = log.filter(e => e.tagLog.some(t => t.erg[p.id])).reverse().map(e => {
    const d = (e.nachher[p.id]||0) - (e.vorher[p.id]||0);
    let be = 0, tage = 0;
    e.tagLog.forEach(t => { if(t.erg[p.id]){ be += t.erg[p.id].be; tage++; } });
    return '<button class="weZeile" data-tu="rechnungWe" data-id="'+p.id+'" data-we="'+e.we.id+'">'
      + '<div class="wztext"><div class="wzname">' + esc(e.we.titel) + '</div>'
      + '<div class="wzmeta">' + datumHuebsch(e.we.datum) + ' · ' + tage + ' '
      + (tage===1?'Tag':'Tage') + ' · ' + zahl(be,2) + ' BE</div></div>'
      + deltaChip(d) + '</button>';
  }).join('') || '<p class="hinweis" style="margin:6px 2px">Noch nicht dabei gewesen.</p>';

  return '<div class="pkopf"><div class="pkname">' + esc(p.name) + '</div>'
    + '<div class="pkelo">' + Math.round(R[p.id]) + '</div></div>'
    + '<div class="kacheln">'
    + '<div><b>' + siege[p.id] + '</b><span>Tagessiege</span></div>'
    + '<div><b>' + zahl(oBe,2) + '</b><span>Ø BE je Tag</span></div>'
    + '<div><b>' + Math.round(hoch[p.id]) + '</b><span>Höchststand</span></div>'
    + '<div><b>' + zahl(liter) + '</b><span>Liter</span></div>'
    + '<div><b>' + zahl(literAf) + '</b><span>Liter alkfrei</span></div>'
    + '<div><b>' + getr + '</b><span>Getränke</span></div>'
    + '<div><b>' + tagTeil[p.id] + '</b><span>Tage</span></div>'
    + '<div><b>' + weTeil[p.id] + '</b><span>Wochenenden</span></div>'
    + '<div><b>' + ortTeil[p.id] + '</b><span>Locations</span></div></div>'
    + '<div class="abschnitt">Orden</div>' + ordenZeilen
    + '<div class="abschnitt">Wochenenden</div>' + wes;
}

/* ---------- Sichern ---------- */
function exportText(){
  /* Der Zugangsschlüssel bleibt draußen: Ein Export wird verschickt, und Verschicktes
     wird weitergeleitet. Er gehört zur Verbindung und ist jederzeit neu einzutragen. */
  const daten = standDaten();
  daten.einst = Object.assign({}, daten.einst);
  delete daten.einst.kiSchluessel;
  return JSON.stringify({app:'bubidos-bierliga', version:1, t:Date.now(), daten:daten});
}
function dateiName(){
  const d = new Date();
  return 'bubidos-' + d.getFullYear() + '-'
    + String(d.getMonth()+1).padStart(2,'0') + '-'
    + String(d.getDate()).padStart(2,'0') + '.json';
}
function herunterladen(){
  try{
    const b = new Blob([exportText()], {type:'application/json'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = dateiName();
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1000);
    exportiert = true;
    return true;
  }catch(e){ return false; }
}
async function inZwischenablage(){
  try{ await navigator.clipboard.writeText(exportText()); exportiert = true; return true; }
  catch(e){ return false; }
}
function einlesen(text){
  const d = JSON.parse(text);
  const k = d && d.daten ? d.daten : d;
  if(!k || !Array.isArray(k.spieler) || !Array.isArray(k.we))
    throw new Error('Das sieht nicht nach einer Bubidos-Sicherung aus');
  return k;
}

  return '<div class="blende" data-tu="sicherHintergrund"><div class="blatt">'
    + '<div class="karte" role="dialog" aria-label="Sichern">' + inhalt + '</div></div></div>';

function modus(){
  if(!token || ghFehler === 'token') return 'token';
  if(ansicht) return ansicht;
  return state.aktivWe ? 'zaehlen' : 'archiv';
}
function kopfBauen(m){
  if(m === 'token'){
    return '<div class="kopf-inner"><div class="kopf-unter">'
      + '<span class="kopf-utitel">Verbinden</span></div></div>';
  }
  if(m === 'zaehlen'){
    const {we, tg, ort} = aktuell();
    if(!we) return '';
    return '<div class="kopf-inner kopf-zaehlen">'
      + '<button class="kopf-ort" data-tu="wechslerAuf">'
      + '<span class="kz-titel">' + esc(we.titel) + '</span>'
      + '<span class="kz-wo">' + esc(tg ? tg.label : '') + ' · '
      + esc(ort && ort.name ? ort.name : 'Location benennen')
      + (tg && ort ? ' · ' + (tg.orte.findIndex(o => o.id === ort.id)+1) + '/' + tg.orte.length : '')
      + ' ⌄</span></button>'
      + '<div class="kopf-tasten">'
      + '<button data-tu="fotoStart" aria-label="Deckel abfotografieren">'
      + '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>'
      + '<circle cx="12" cy="13" r="4"/></svg></button>'
      + '<button data-tu="geheZwischen" aria-label="Zwischenstand">'
      + '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
      + 'stroke-linecap="round" aria-hidden="true">'
      + '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button></div></div>';
  }

  const zurueck = (m === 'einst' || m === 'info' || m === 'wedetail' || m === 'person' || m === 'zwischen')
    ? '<button class="kopf-zurueck" data-tu="zurueckNavi">‹ zurück</button>' : '';
  const titel = m === 'einst' ? 'Einstellungen'
              : m === 'info' ? 'Betriebsanleitung'
              : m === 'wedetail' ? 'Wochenende'
              : m === 'person' ? 'Spieler'
              : m === 'zwischen' ? 'Zwischenstand'
              : null;

  if(titel){
    return '<div class="kopf-inner"><div class="kopf-unter">' + zurueck
      + '<span class="kopf-utitel">' + titel + '</span></div></div>';
  }

  const {weTeil, tagTeil, log} = berechnen();
  const gewertet = log.filter(e => e.tagLog.length);
  const tage = gewertet.reduce((n,e) => n + e.tagLog.length, 0);
  let liter = 0;
  gewertet.forEach(e => e.tagLog.forEach(t => Object.keys(t.erg).forEach(id => liter += t.erg[id].liter)));
  const zahlen = gewertet.length
    ? gewertet.length + ' ' + (gewertet.length===1?'Wochenende':'Wochenenden') + ' · '
      + tage + ' ' + (tage===1?'Tag':'Tage') + ' · ' + zahl(liter) + ' L'
    : 'Noch kein Wochenende gewertet';

  return '<div class="kopf-inner"><div class="kopf-archiv">'
    + '<div class="marke">' + markeSvg(56, false) + '</div>'
    + '<div class="kopf-mitte"><div class="kopf-wort">Bubidos Bierliga</div>'
    + '<div class="kopf-zahlen">' + zahlen + '</div></div>'
    + '<div class="kopf-tasten">'
    + '<button data-tu="geheEinst" aria-label="Einstellungen">'
    + '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
    + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
    + '</svg></button></div></div></div>';
}

function zeichnen(){
  try{ zeichnenRoh(); }
  catch(err){
    console.error('Zeichnen fehlgeschlagen:', err);
    document.querySelectorAll('.blende').forEach(x => x.remove());
    foto = null; blatt = null; rechnung = null; wechsler = false;
    punkteOffen = false; benennen = false; rundeFrage = false; sicherBlatt = null;
    erklaer = null;
    const app = document.getElementById('app');
    if(app) app.innerHTML = '<div class="leerzustand"><h2>Da ist was schiefgelaufen</h2>'
      + '<p>Die Anzeige konnte nicht aufgebaut werden. Deine Daten sind gespeichert.</p></div>'
      + '<button class="knopf voll" data-tu="geheArchiv">Zur Übersicht</button>'
      + '<button class="knopf leer" data-tu="frisch">Stand neu laden</button>'
      + '<p class="hinweis">' + esc(String(err && err.message || err)) + '</p>';
  }
}
function zeichnenRoh(){
  const m = modus();
  document.getElementById('kopf').innerHTML = kopfBauen(m);
  document.getElementById('app').innerHTML =
