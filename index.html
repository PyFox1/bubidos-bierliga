    zeichnen();
  },
  fotoZu(){ foto = null; zeichnen(); },
  fotoHintergrund(){},
  fotoUebernehmen(){
    const {ort} = aktuell();
    if(!ort){ foto = null; zeichnen(); return; }
    /* Erst je Person zusammenfassen: Zwei Zeilen auf denselben Namen dürfen sich
       beim Ersetzen nicht gegenseitig überschreiben. */
    const proPerson = {};
    foto.treffer.forEach(t => {
      const id = t.ziel;
      if(!id || !ort.getraenke[id]) return;
      if(!proPerson[id]) proPerson[id] = leereZaehlung();
      KOMBIS.forEach(k => proPerson[id][k] += Math.max(0, Math.round(t.z[k] || 0)));
    });
    const ids = Object.keys(proPerson);
    ids.forEach(id => {
      const neu = ausZaehlung(proPerson[id]);
      ort.getraenke[id] = foto.ersetzen ? neu : ort.getraenke[id].concat(neu);
    });
    const getroffen = ids.length;
    if(getroffen) tagebuch(ort, {art:'foto', n:getroffen});
    foto = null; sichern(); zeichnen();
    toast(getroffen ? (getroffen === 1 ? 'Eingetragen' : getroffen + ' Strichlisten eingetragen')
                    : 'Nichts zugeordnet, nichts eingetragen');
  },

  weSchliessen(){
    const we = state.we.find(w => w.id === state.aktivWe);
    we.zu = true; fazitOffen = we.id;
    state.aktivWe = null; state.aktivTag = null; state.aktivOrt = null;
    ansicht = 'archiv'; stapel = [];
    sichern({sicherung:'Wochenende abgeschlossen'}); zeichnen();
  },
  weOeffnen(el){
    const we = state.we.find(w => w.id === +el.dataset.id);
    we.zu = false;
    const tg = we.tage[we.tage.length-1];
    state.aktivWe = we.id; state.aktivTag = tg.id;
    state.aktivOrt = tg.orte[tg.orte.length-1].id;
    ansicht = null; detailId = null; sichern(); zeichnen();
  },
  weWeg(el){
    state.we = state.we.filter(w => w.id !== +el.dataset.id);
    state.aktivWe = null; state.aktivTag = null; state.aktivOrt = null;
    ansicht = 'archiv'; sichern(); zeichnen();
  },
  weLoeschen(el){ state.we = state.we.filter(w => w.id !== +el.dataset.id);
    detailId = null; ansicht = 'archiv'; sichern(); zeichnen(); },
  fazitZu(){ fazitOffen = null; zeichnen(); },
  deckelAn(el){
    state.einst.deckel = el.dataset.m === 'an' ? (state.einst.deckel > 0 ? state.einst.deckel : 8) : 0;
    sichern(); zeichnen();
  },
  einstSichern(){
    const k = parseFloat(document.getElementById('kFaktor').value);
    if(!(k > 0)){ toast('K muss größer als null sein'); return; }
    state.einst.k = k;
    const dEl = document.getElementById('deckelWert');
    if(dEl){
      const d = parseFloat(dEl.value);
      if(!(d > 0)){ toast('Deckel muss größer als null sein'); return; }
      state.einst.deckel = d;
    }
    sichern(); zeichnen(); toast('Regler übernommen – alles neu gerechnet');
  },
  async frisch(){
    const vorher = state.stand;
    const ok = await laden();
    zeichnen();
    toast(ok ? (state.stand > vorher ? 'Neuer Stand da' : 'Alles aktuell') : 'Nichts zu holen');
  },
  allesWeg(){
    /* Der Zugangsschlüssel gehört zur Verbindung, nicht zur Liga – er überlebt,
       damit das Foto-Zählen nach einem Rücksetzen nicht still tot ist. */
    const kiAlt = {kiSchluessel:state.einst.kiSchluessel || '',
                   kiModell:state.einst.kiModell || 'claude-opus-5'};
    state.spieler = []; state.we = [];
    state.einst = Object.assign({k:40, deckel:0}, kiAlt);
    state.aktivWe = null; state.aktivTag = null; state.aktivOrt = null;
    fazitOffen = null; foto = null; blatt = null; wechsler = false; detailId = null;
    personId = null; rechnung = null; punkteOffen = false; benennen = false;
    sicherBlatt = null; erklaer = null;
    neuKombi = {s:'normal', g:'05'}; ansicht = 'archiv';
    sichern(); zeichnen();
  }
};

document.getElementById('kamera').addEventListener('change', async ev => {
  const datei = ev.target.files[0];
  ev.target.value = '';
  if(!datei || !foto) return;
  foto.phase = 'laedt'; foto.bild = null; zeichnen();
  try{
    foto.bild = await bildVerkleinern(datei, 1400);
    zeichnen();
    const d = await anKI(foto.bild, anweisungZettel());
    const roh = Array.isArray(d.eintraege) ? d.eintraege : [];
    if(!roh.length) throw new Error('Es war keine Strichliste zu erkennen');
    const {ort} = aktuell();
    const hier = ort ? Object.keys(ort.getraenke) : [];
    const benannt = [], ohne = leereZaehlung(), fremde = [];
    roh.forEach(e => {
      const z = gruppenLesen(e.gruppen);
      const id = nameZuId(e.name, hier);
      if(id){ benannt.push({ziel:id, z:z}); return; }
      /* Ein gelesener Name, der hier nicht am Tisch sitzt, wandert in den Topf –
         das wird angezeigt, statt still zu passieren. */
      const gelesen = String(e.name || '').trim();
      if(gelesen && !fremde.includes(gelesen)) fremde.push(gelesen);
      KOMBIS.forEach(k => ohne[k] += z[k]);
    });
    foto.benannt = benannt;
    foto.ohne = ohne;
    foto.ohneZiel = null;
    foto.fremdeNamen = fremde;
    fotoVerteilen();
    foto.sicherheit = ['hoch','mittel','niedrig'].includes(d.sicherheit) ? d.sicherheit : 'mittel';
    foto.hinweis = typeof d.hinweis === 'string' ? d.hinweis : '';
    foto.phase = 'ergebnis';
  }catch(err){
    foto.phase = 'fehler';
    foto.fehlerText = err && err.message ? err.message : 'Unbekannter Fehler';
  }
  zeichnen();
});

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-tu]');
  if(el){
    if(/Hintergrund$/.test(el.dataset.tu) && ev.target !== el) return;
    if(el.dataset.tu === 'fazitZu' && ev.target === el && ev.target.classList.contains('blende')){
      tu.fazitZu(); return;
    }
    const key = el.dataset.tu + ':' + (el.dataset.id || '');
    if(el.dataset.frage && frage !== key){
      frage = key; zeichnen();
      setTimeout(() => { if(frage === key){ frage = null; zeichnen(); } }, 4000);
      return;
    }
    frage = null;
    tu[el.dataset.tu](el);
  }
});
document.addEventListener('change', ev => {
  const s = ev.target.closest('[data-zuord]');
  if(s && foto) foto.treffer[+s.dataset.zuord].ziel = s.value || null;
});
document.addEventListener('input', ev => {
  if(ev.target.id === 'ortName'){
    const {ort} = aktuell();
    if(ort){ ort.name = ev.target.value; clearTimeout(window.__ot);
      window.__ot = setTimeout(sichern, 700); }
  }
});
let wischStart = null;
document.addEventListener('touchstart', ev => {
  if(ev.touches.length !== 1) { wischStart = null; return; }
  if(modus() !== 'zaehlen') { wischStart = null; return; }
  if(document.querySelector('.blende')) { wischStart = null; return; }
  // Waagerecht scrollbare Bereiche und Eingaben ausnehmen
  if(ev.target.closest('.chips, .leiste, input, select, textarea, .kettennavi')) {
    wischStart = null; return;
  }
  const t = ev.touches[0];
  wischStart = {x:t.clientX, y:t.clientY, t:Date.now()};
}, {passive:true});

document.addEventListener('touchend', ev => {
  if(!wischStart) return;
  const s = wischStart; wischStart = null;
  const t = ev.changedTouches[0];
  if(!t) return;
  const dx = t.clientX - s.x, dy = t.clientY - s.y;
  if(Date.now() - s.t > 800) return;
  if(Math.abs(dx) < 70) return;
  if(Math.abs(dx) < Math.abs(dy) * 2) return;
  tu.bewege(dx < 0 ? 1 : -1);
}, {passive:true});

document.addEventListener('keydown', ev => {
  if(ev.key === 'Enter' && ev.target.id === 'neuName'){ ev.preventDefault(); tu.spielerRein(); }
  if(ev.key === 'Enter' && ev.target.id === 'gastName'){ ev.preventDefault(); tu.gastRein(); }
  if(ev.key === 'Enter' && ev.target.id === 'weNeuName'){ ev.preventDefault(); tu.weNeuSpieler(); }
  if(ev.key === 'Enter' && ev.target.id === 'weOrt'){ ev.preventDefault(); tu.weStart(); }
  if(ev.key === 'Enter' && ev.target.id === 'ortNameNeu'){ ev.preventDefault(); tu.benennenFertig(); }
  if(modus() === 'zaehlen' && !document.querySelector('.blende')
     && !/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)){
    if(ev.key === 'ArrowLeft'){ ev.preventDefault(); tu.bewege(-1); return; }
    if(ev.key === 'ArrowRight'){ ev.preventDefault(); tu.bewege(1); return; }
  }
  if(ev.key === 'Escape'){
    if(erklaer) tu.erklaerZu(); else if(sicherBlatt) tu.sicherZu();
    else if(foto) tu.fotoZu();
    else if(rechnung) { if(rechnung.tagId) tu.rechnungAlle(); else tu.rechnungZu(); }
    else if(punkteOffen) tu.punkteZu(); else if(blatt) tu.blattZu();
    else if(benennen) tu.benennenFertig();
    else if(wechsler) tu.wechslerZu(); else if(fazitOffen) tu.fazitZu();
  }
});

const BUBIDOS = ['Korbi','Fifu','Sperry','Gerry','Kammy'];

(async function(){
  ichLaden();
  token = lokal.lesen(TOKEN_KEY);
  if(token){
    const ok = await laden();
    if(ok === true || ok === 'leer'){
      let nochmal = false;
      if(ok === 'leer' && !state.spieler.length){
        BUBIDOS.forEach((n,i) => state.spieler.push({id:Date.now()+i, name:n}));
        nochmal = true;
      }
      if(geraetSichern()) nochmal = true;
      if(nochmal) await sichern({sofort:true});
    } else if(ghFehler === 'netz'){
      const sp = spiegelLesen();
      if(sp){ uebernehmen(sp); toast('Offline – lokale Kopie, Änderungen gehen später raus'); }
    }
  }
  zeichnen();
})();
