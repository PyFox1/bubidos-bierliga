document.getElementById('kamera').addEventListener('change', async ev => {
  const datei = ev.target.files[0];
  ev.target.value = '';
  if(!datei || !foto) return;
  foto.phase = 'laedt'; foto.bild = null; zeichnen();
  try{
    foto.bild = await bildVerkleinern(datei, 1400);
    zeichnen();
    const d = await anKI(foto.bild, foto.modus === 'person' ? anweisungEiner() : anweisungZettel());
    const roh = Array.isArray(d.eintraege) ? d.eintraege : [];
    if(!roh.length) throw new Error('Es war keine Strichliste zu erkennen');
    if(foto.modus === 'person'){
      foto.treffer = [{name:'', ziel:foto.person, z:gruppenLesen(roh[0].gruppen)}];
    } else {
      foto.treffer = roh.map(t => ({name:String(t.name || 'ohne Namen'),
        ziel:nameZuId(t.name), z:gruppenLesen(t.gruppen)}));
    }
    foto.sicherheit = ['hoch','mittel','niedrig'].includes(d.sicherheit) ? d.sicherheit : 'mittel';
    foto.hinweis = typeof d.hinweis === 'string' ? d.hinweis : '';
    foto.phase = 'ergebnis';
  }catch(err){
    foto.phase = 'fehler';
    foto.fehlerText = err && err.message ? err.message : 'Unbekannter Fehler';
  }
  zeichnen();
});

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-tu]');
  if(el){
    if(/Hintergrund$/.test(el.dataset.tu) && ev.target !== el) return;
    if(el.dataset.tu === 'fazitZu' && ev.target === el && ev.target.classList.contains('blende')){
      tu.fazitZu(); return;
    }
    const key = el.dataset.tu + ':' + (el.dataset.id || '');
    if(el.dataset.frage && frage !== key){
      frage = key; zeichnen();
      setTimeout(() => { if(frage === key){ frage = null; zeichnen(); } }, 4000);
      return;
    }
    frage = null;
    tu[el.dataset.tu](el);
  }
});
document.addEventListener('change', ev => {
  const s = ev.target.closest('[data-zuord]');
  if(s && foto) foto.treffer[+s.dataset.zuord].ziel = s.value || null;
});
document.addEventListener('input', ev => {
  if(ev.target.id === 'ortName'){
    const {ort} = aktuell();
    if(ort){ ort.name = ev.target.value; clearTimeout(window.__ot);
      window.__ot = setTimeout(sichern, 700); }
  }
});
let wischStart = null;
document.addEventListener('touchstart', ev => {
  if(ev.touches.length !== 1) { wischStart = null; return; }
  if(modus() !== 'zaehlen') { wischStart = null; return; }
  if(document.querySelector('.blende')) { wischStart = null; return; }
  // Waagerecht scrollbare Bereiche und Eingaben ausnehmen
  if(ev.target.closest('.chips, .leiste, input, select, textarea, .kettennavi')) {
    wischStart = null; return;
  }
  const t = ev.touches[0];
  wischStart = {x:t.clientX, y:t.clientY, t:Date.now()};
}, {passive:true});

document.addEventListener('touchend', ev => {
  if(!wischStart) return;
  const s = wischStart; wischStart = null;
  const t = ev.changedTouches[0];
  if(!t) return;
  const dx = t.clientX - s.x, dy = t.clientY - s.y;
  if(Date.now() - s.t > 800) return;
  if(Math.abs(dx) < 70) return;
  if(Math.abs(dx) < Math.abs(dy) * 2) return;
  tu.bewege(dx < 0 ? 1 : -1);
}, {passive:true});

document.addEventListener('keydown', ev => {
  if(ev.key === 'Enter' && ev.target.id === 'neuName'){ ev.preventDefault(); tu.spielerRein(); }
  if(ev.key === 'Enter' && ev.target.id === 'gastName'){ ev.preventDefault(); tu.gastRein(); }
  if(ev.key === 'Enter' && ev.target.id === 'weNeuName'){ ev.preventDefault(); tu.weNeuSpieler(); }
  if(ev.key === 'Enter' && ev.target.id === 'weOrt'){ ev.preventDefault(); tu.weStart(); }
  if(ev.key === 'Enter' && ev.target.id === 'ortNameNeu'){ ev.preventDefault(); tu.benennenFertig(); }
  if(modus() === 'zaehlen' && !document.querySelector('.blende')
     && !/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)){
    if(ev.key === 'ArrowLeft'){ ev.preventDefault(); tu.bewege(-1); return; }
    if(ev.key === 'ArrowRight'){ ev.preventDefault(); tu.bewege(1); return; }
  }
  if(ev.key === 'Escape'){
    if(erklaer) tu.erklaerZu(); else if(sicherBlatt) tu.sicherZu();
    else if(foto) tu.fotoZu();
    else if(rechnung) { if(rechnung.tagId) tu.rechnungAlle(); else tu.rechnungZu(); }
    else if(punkteOffen) tu.punkteZu(); else if(blatt) tu.blattZu();
    else if(benennen) tu.benennenFertig();
    else if(wechsler) tu.wechslerZu(); else if(fazitOffen) tu.fazitZu();
  }
});

const BUBIDOS = ['Korbi','Fifu','Sperry','Gerry','Kammy'];

(async function(){
  ichLaden();
  token = lokal.lesen(TOKEN_KEY);
  if(token){
    const ok = await laden();
    if(ok === true || ok === 'leer'){
      let nochmal = false;
      if(ok === 'leer' && !state.spieler.length){
        BUBIDOS.forEach((n,i) => state.spieler.push({id:Date.now()+i, name:n}));
        nochmal = true;
      }
      if(geraetSichern()) nochmal = true;
      if(nochmal) await sichern({sofort:true});
    } else if(ghFehler === 'netz'){
      const sp = spiegelLesen();
      if(sp){ uebernehmen(sp); toast('Offline – lokale Kopie, Änderungen gehen später raus'); }
    }
  }
  zeichnen();
})();
</script>
